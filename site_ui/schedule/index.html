---
layout: default
title: Schedule
permalink: /schedule/
---
    <div class="schedule-container">
        <h2 id="team-name">Schedule</h2>
        <div id="schedule-content">Loading...</div>
    </div>
    <script>
        checkAuth();

        const { teamId: TEAM_ID, league: LEAGUE, sportPath: SPORT_PATH, collectionName: COLLECTION_NAME } = getAppContext();
        let USER_UID = (typeof auth !== 'undefined' && auth && auth.currentUser) ? auth.currentUser.uid : null;
        let playerMap = {};
        let allScheduleEvents = [];

        function loadScheduleData() {
            // Fetch roster and schedule in parallel
            Promise.all([
                fetchTeamRoster(SPORT_PATH, TEAM_ID).catch(() => null),
                fetchTeamSchedule(SPORT_PATH, TEAM_ID)
            ])
            .then(([rosterData, data]) => {
                const athletes = rosterData?.athletes || rosterData?.team?.athletes || [];
                athletes.forEach(p => playerMap[p.id] = p.shortName || p.displayName);

                const events = (data?.events || []).slice();
                events.sort((a, b) => new Date(a.date || a.competitions?.[0]?.date) - new Date(b.date || b.competitions?.[0]?.date));
                allScheduleEvents = events;
                const teamDisplayName = escapeHtml(data?.team?.displayName || rosterData?.team?.displayName || 'Team');
                document.getElementById('team-name').textContent = `${teamDisplayName} Schedule`;
                
                if (events.length === 0) {
                    document.getElementById('schedule-content').innerHTML = '<p class="loading" style="padding: 20px;">No scheduled games found for this season.</p>';
                    return;
                }

                let tableRowsHtml = '';
                let cardItemsHtml = '';
                
                events.forEach(event => {
                    const game = event.competitions?.[0];
                    if (!game) return;
                    const date = new Date(event.date);
                    const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                    
                    const myTeam = game.competitors?.find(c => String(c.team.id) === String(TEAM_ID));
                    if (!myTeam) return;

                    const opponent = game.competitors?.find(c => String(c.team.id) !== String(TEAM_ID));
                    
                    const isHome = myTeam.homeAway === 'home';
                    const vsAt = isHome ? 'vs' : '@';
                    
                    let result = escapeHtml(game.status?.type?.detail || '');
                    
                    if (game.status?.type?.state === 'post') {
                        const isWin = myTeam.winner;
                        const myScore = myTeam.score?.displayValue ?? myTeam.score ?? '';
                        const oppScore = opponent?.score?.displayValue ?? opponent?.score ?? '';
                        const score = (myScore && oppScore) ? `${myScore}-${oppScore}` : '';
                        let otInfo = '';
                        if (game.status?.type?.shortDetail && game.status.type.shortDetail.includes('/')) {
                            otInfo = ` <span style="font-size:0.85em; color:#666;">(${escapeHtml(game.status.type.shortDetail.split('/')[1])})</span>`;
                        }
                        result = `<span class="${isWin ? 'win' : 'loss'}">${isWin ? 'W' : 'L'}</span> ${score}${otInfo}`;
                    } else if (game.status?.type?.state === 'in') {
                        const myScore = myTeam.score?.displayValue ?? myTeam.score ?? '0';
                        const oppScore = opponent?.score?.displayValue ?? opponent?.score ?? '0';
                        const detail = escapeHtml(game.status?.type?.shortDetail || game.status?.type?.detail || 'LIVE');
                        result = `<span class="badge-live" style="background:#cc0000; color:white; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:bold; margin-right:4px;">LIVE</span> ${myScore}-${oppScore} <span style="font-size:0.85em; color:#666;">(${detail})</span>`;
                    } else {
                        result = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                    }

                    const logo = opponent ? getTeamLogoHtml(opponent.team) : '';
                    const oppName = escapeHtml(opponent?.team?.shortDisplayName || opponent?.team?.displayName || 'Opponent');

                    // Desktop Table Row
                    tableRowsHtml += `<tr class="schedule-game-row" data-game-id="${escapeHtml(game.id)}" style="cursor: pointer;">
                        <td>${dateStr}</td>
                        <td>${vsAt} ${logo}${oppName}</td>
                        <td>${result}</td>
                        <td id="val-${escapeHtml(game.id)}" style="font-size: 0.9em; color: #666;">-</td>
                        <td id="pick-${escapeHtml(game.id)}" style="font-size: 0.9em; color: #666;">-</td>
                    </tr>`;

                    // Mobile Card
                    cardItemsHtml += `
                    <div class="schedule-card schedule-game-row" data-game-id="${escapeHtml(game.id)}">
                        <div class="schedule-card-top">
                            <span class="schedule-card-date">${dateStr}</span>
                            <span class="schedule-card-result">${result}</span>
                        </div>
                        <div class="schedule-card-matchup">
                            ${logo}
                            <span>${vsAt} ${oppName}</span>
                        </div>
                        <div class="schedule-card-bottom">
                            <div class="schedule-card-chip">
                                <span class="chip-label">Top Player (VAL)</span>
                                <span class="chip-val" id="val-card-${escapeHtml(game.id)}">-</span>
                            </div>
                            <div class="schedule-card-chip" id="pick-chip-${escapeHtml(game.id)}">
                                <span class="chip-label">Your Pick</span>
                                <span class="chip-val" id="pick-card-${escapeHtml(game.id)}">-</span>
                            </div>
                        </div>
                    </div>`;
                });
                
                const tableHtml = `
                <table class="schedule-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Opponent</th>
                            <th>Result/Time</th>
                            <th>Top Player (VAL)</th>
                            <th>Your Pick (VAL)</th>
                        </tr>
                    </thead>
                    <tbody>${tableRowsHtml}</tbody>
                </table>`;
                
                const cardsHtml = `<div class="schedule-cards-container">${cardItemsHtml}</div>`;
                
                const schedContent = document.getElementById('schedule-content');
                schedContent.innerHTML = tableHtml + cardsHtml;

                schedContent.addEventListener('click', (e) => {
                    const row = e.target.closest('.schedule-game-row');
                    if (row && row.dataset.gameId) {
                        window.location.href = `/College-Basketball-Stats/scoreboard#${encodeURIComponent(row.dataset.gameId)}`;
                    }
                });

                // Fetch details for completed games and user picks
                loadGameDetailsAndPicks(events);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('schedule-content').innerHTML = '<div class="error">Failed to load data. Please try again later.</div>';
            });
        }

        function loadGameDetailsAndPicks(events) {
            const userPicksByGame = {};
            const promises = events.map(event => {
                const game = event.competitions?.[0];
                if (!game) return Promise.resolve();
                
                const summaryPromise = (game.status?.type?.state === 'post') 
                    ? fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${encodeURIComponent(SPORT_PATH)}/summary?event=${encodeURIComponent(game.id)}`).then(r => r.json()).catch(() => null)
                    : Promise.resolve(null);
                const pickPromise = (USER_UID && typeof db !== 'undefined' && db) 
                    ? db.collection(COLLECTION_NAME).doc(String(event.id)).get().catch(() => null)
                    : Promise.resolve(null);

                return Promise.all([summaryPromise, pickPromise]).then(([summary, pickDoc]) => {
                    if (summary && summary.boxscore && summary.boxscore.players) {
                        const teamStats = summary.boxscore.players.find(p => String(p.team?.id) === String(TEAM_ID));
                        if (teamStats && teamStats.statistics && teamStats.statistics[0]) {
                            const statsData = teamStats.statistics[0];
                            const labels = statsData.names;
                            const athletes = statsData.athletes;
                            
                            let maxVal = -Infinity;
                            let topPlayer = null;
                            let topPlayerId = null;

                            athletes.forEach(player => {
                                const val = calculateVal(player.stats, labels);
                                if (val > maxVal) {
                                    maxVal = val;
                                    topPlayer = player.athlete ? (player.athlete.shortName || player.athlete.displayName) : player.displayName;
                                    topPlayerId = player.athlete ? player.athlete.id : null;
                                }
                            });

                            if (topPlayer) {
                                const cell = document.getElementById(`val-${game.id}`);
                                const cardCell = document.getElementById(`val-card-${game.id}`);
                                const topPlayerStr = `<strong>${escapeHtml(topPlayer)}</strong> (${maxVal})`;
                                if (cell) {
                                    cell.innerHTML = topPlayerStr;
                                    cell.style.color = '';
                                }
                                if (cardCell) {
                                    cardCell.innerHTML = topPlayerStr;
                                }
                            }

                            // Update Pick VAL if pick exists
                            if (pickDoc && pickDoc.exists) {
                                const pickedPlayerId = pickDoc.data()[USER_UID];
                                if (pickedPlayerId) {
                                    userPicksByGame[String(event.id)] = String(pickedPlayerId);
                                    const player = athletes.find(p => p.athlete && String(p.athlete.id) === String(pickedPlayerId));
                                    if (player) {
                                        const val = calculateVal(player.stats, labels);
                                        const pickCell = document.getElementById(`pick-${game.id}`);
                                        const pickCardCell = document.getElementById(`pick-card-${game.id}`);
                                        const pickChip = document.getElementById(`pick-chip-${game.id}`);
                                        const playerName = player.athlete ? (player.athlete.shortName || player.athlete.displayName) : (playerMap[pickedPlayerId] || 'Unknown');
                                        const pickStr = `<strong>${escapeHtml(playerName)}</strong> (${val})`;

                                        if (pickCell) {
                                            pickCell.innerHTML = pickStr;
                                            pickCell.style.color = '';
                                            if (topPlayerId && String(pickedPlayerId) === String(topPlayerId)) {
                                                pickCell.classList.add('correct-pick');
                                            }
                                        }
                                        if (pickCardCell) {
                                            pickCardCell.innerHTML = pickStr;
                                            if (topPlayerId && String(pickedPlayerId) === String(topPlayerId) && pickChip) {
                                                pickChip.classList.add('correct-pick');
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }

                    // Handle Pick Name (if not already handled by VAL update or if game not complete)
                    const isPreGame = game.status?.type?.state === 'pre' || !game.status?.type?.completed;
                    if (pickDoc && pickDoc.exists) {
                        const pickedPlayerId = pickDoc.data()[USER_UID];
                        if (pickedPlayerId) {
                            userPicksByGame[String(event.id)] = String(pickedPlayerId);
                            const pickCell = document.getElementById(`pick-${game.id}`);
                            const pickCardCell = document.getElementById(`pick-card-${game.id}`);
                            if (pickCell && (pickCell.textContent === '-' || pickCell.textContent === '')) {
                                const playerName = playerMap[pickedPlayerId] || 'Unknown';
                                const valDisplay = (game.status?.type?.state === 'post') ? ' (0)' : '';
                                const pickNameStr = isPreGame 
                                    ? `<span class="badge-pick-saved">✓ ${escapeHtml(playerName)}</span>`
                                    : `<strong>${escapeHtml(playerName)}</strong>${valDisplay}`;
                                pickCell.innerHTML = pickNameStr;
                                pickCell.style.color = '';
                                if (pickCardCell) {
                                    pickCardCell.innerHTML = pickNameStr;
                                }
                            }
                        } else if (isPreGame) {
                            const pickCell = document.getElementById(`pick-${game.id}`);
                            const pickCardCell = document.getElementById(`pick-card-${game.id}`);
                            const neededHtml = `<span class="badge-pick-needed">Pick Needed &rarr;</span>`;
                            if (pickCell && (pickCell.textContent === '-' || pickCell.textContent === '')) {
                                pickCell.innerHTML = neededHtml;
                            }
                            if (pickCardCell && (pickCardCell.textContent === '-' || pickCardCell.textContent === '')) {
                                pickCardCell.innerHTML = neededHtml;
                            }
                        }
                    } else if (isPreGame) {
                        const pickCell = document.getElementById(`pick-${game.id}`);
                        const pickCardCell = document.getElementById(`pick-card-${game.id}`);
                        const neededHtml = `<span class="badge-pick-needed">Pick Needed &rarr;</span>`;
                        if (pickCell && (pickCell.textContent === '-' || pickCell.textContent === '')) {
                            pickCell.innerHTML = neededHtml;
                        }
                        if (pickCardCell && (pickCardCell.textContent === '-' || pickCardCell.textContent === '')) {
                            pickCardCell.innerHTML = neededHtml;
                        }
                    }
                }).catch(err => {
                    console.warn(`Error processing game ${game.id}:`, err);
                });
            });

            Promise.all(promises).then(() => {
                checkScheduleCooldownConflicts(events, userPicksByGame);
            });
        }

        function checkScheduleCooldownConflicts(events, userPicksByGame) {
            for (let i = 0; i < events.length - 1; i++) {
                const e1 = events[i];
                const e2 = events[i + 1];
                const p1 = userPicksByGame[String(e1.id)];
                const p2 = userPicksByGame[String(e2.id)];
                if (p1 && p2 && p1 === p2) {
                    const g1State = e1.competitions?.[0]?.status?.type?.state;
                    const g2State = e2.competitions?.[0]?.status?.type?.state;
                    if (g1State === 'pre') {
                        flagCooldownConflict(e1.id);
                    }
                    if (g2State === 'pre') {
                        flagCooldownConflict(e2.id);
                    }
                }
            }
        }

        function flagCooldownConflict(gameId) {
            const pickCell = document.getElementById(`pick-${gameId}`);
            const pickCardCell = document.getElementById(`pick-card-${gameId}`);
            const conflictBadge = `<span class="badge-cooldown-conflict" title="Cooldown conflict: Same player picked 2 games in a row. Click to change.">⚠️ Cooldown Conflict</span>`;
            if (pickCell && !pickCell.innerHTML.includes('badge-cooldown-conflict')) {
                pickCell.innerHTML += ` ${conflictBadge}`;
            }
            if (pickCardCell && !pickCardCell.innerHTML.includes('badge-cooldown-conflict')) {
                pickCardCell.innerHTML += ` ${conflictBadge}`;
            }
        }

        loadScheduleData();

        if (typeof auth !== 'undefined' && auth) {
            auth.onAuthStateChanged(user => {
                if (user && user.uid !== USER_UID) {
                    USER_UID = user.uid;
                    if (allScheduleEvents.length > 0) {
                        loadGameDetailsAndPicks(allScheduleEvents);
                    }
                }
            });
        }
    </script>
