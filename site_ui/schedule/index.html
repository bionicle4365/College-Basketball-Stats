---
layout: default
title: Schedule
permalink: /schedule/
---
    <div class="schedule-container">
        <h2 id="team-name">Schedule</h2>
        <div id="schedule-content">Loading...</div>
    </div>
    <script>
        checkAuth();

        const TEAM_ID = getFavoriteTeamId();
        const LEAGUE = getLeague();
        const SPORT_PATH = getSportPath();
        const COLLECTION_NAME = getCollectionName(TEAM_ID, LEAGUE);
        let USER_UID = null
        let playerMap = {};

        auth.onAuthStateChanged(user => {
            if (user) {
                USER_UID = user.uid;
            }
            // Fetch roster first to get player names
            fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${SPORT_PATH}/teams/${TEAM_ID}?enable=roster`)
                .then(r => r.json())
                .then(data => {
                if (data.team && data.team.athletes) {
                    data.team.athletes.forEach(p => playerMap[p.id] = p.shortName || p.displayName);
                }
                return fetchTeamSchedule(SPORT_PATH, TEAM_ID);
            })
            .then(data => {
                const events = data.events || [];
                const teamDisplayName = escapeHtml(data.team?.displayName || 'Team');
                document.getElementById('team-name').textContent = `${teamDisplayName} Schedule`;
                
                if (events.length === 0) {
                    document.getElementById('schedule-content').innerHTML = '<p class="loading" style="padding: 20px;">No scheduled games found for this season.</p>';
                    return;
                }

                let tableRowsHtml = '';
                let cardItemsHtml = '';
                
                events.forEach(event => {
                    const game = event.competitions[0];
                    const date = new Date(event.date);
                    const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                    
                    const myTeam = game.competitors.find(c => c.team.id === TEAM_ID);
                    if (!myTeam) return;

                    const opponent = game.competitors.find(c => c.team.id !== TEAM_ID);
                    
                    const isHome = myTeam.homeAway === 'home';
                    const vsAt = isHome ? 'vs' : '@';
                    
                    let result = escapeHtml(game.status.type.detail);
                    
                    if (game.status.type.state === 'post') {
                        const isWin = myTeam.winner;
                        const score = `${myTeam.score.displayValue}-${opponent.score.displayValue}`;
                        let otInfo = '';
                        if (game.status.type.shortDetail && game.status.type.shortDetail.includes('/')) {
                            otInfo = ` <span style="font-size:0.85em; color:#666;">(${escapeHtml(game.status.type.shortDetail.split('/')[1])})</span>`;
                        }
                        result = `<span class="${isWin ? 'win' : 'loss'}">${isWin ? 'W' : 'L'}</span> ${score}${otInfo}`;
                    } else {
                         result = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                    }

                    const logo = getTeamLogoHtml(opponent.team);
                    const oppName = escapeHtml(opponent.team.shortDisplayName || opponent.team.displayName);

                    // Desktop Table Row
                    tableRowsHtml += `<tr class="schedule-game-row" data-game-id="${escapeHtml(game.id)}" style="cursor: pointer;">
                        <td>${dateStr}</td>
                        <td>${vsAt} ${logo}${oppName}</td>
                        <td>${result}</td>
                        <td id="val-${escapeHtml(game.id)}" style="font-size: 0.9em; color: #666;">-</td>
                        <td id="pick-${escapeHtml(game.id)}" style="font-size: 0.9em; color: #666;">-</td>
                    </tr>`;

                    // Mobile Card
                    cardItemsHtml += `
                    <div class="schedule-card schedule-game-row" data-game-id="${escapeHtml(game.id)}">
                        <div class="schedule-card-top">
                            <span class="schedule-card-date">${dateStr}</span>
                            <span class="schedule-card-result">${result}</span>
                        </div>
                        <div class="schedule-card-matchup">
                            ${logo}
                            <span>${vsAt} ${oppName}</span>
                        </div>
                        <div class="schedule-card-bottom">
                            <div class="schedule-card-chip">
                                <span class="chip-label">Top Player (VAL)</span>
                                <span class="chip-val" id="val-card-${escapeHtml(game.id)}">-</span>
                            </div>
                            <div class="schedule-card-chip" id="pick-chip-${escapeHtml(game.id)}">
                                <span class="chip-label">Your Pick</span>
                                <span class="chip-val" id="pick-card-${escapeHtml(game.id)}">-</span>
                            </div>
                        </div>
                    </div>`;
                });
                
                const tableHtml = `
                <table class="schedule-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Opponent</th>
                            <th>Result/Time</th>
                            <th>Top Player (VAL)</th>
                            <th>Your Pick (VAL)</th>
                        </tr>
                    </thead>
                    <tbody>${tableRowsHtml}</tbody>
                </table>`;
                
                const cardsHtml = `<div class="schedule-cards-container">${cardItemsHtml}</div>`;
                
                const schedContent = document.getElementById('schedule-content');
                schedContent.innerHTML = tableHtml + cardsHtml;

                schedContent.addEventListener('click', (e) => {
                    const row = e.target.closest('.schedule-game-row');
                    if (row && row.dataset.gameId) {
                        window.location.href = `/College-Basketball-Stats/scoreboard#${encodeURIComponent(row.dataset.gameId)}`;
                    }
                });

                // Fetch details for completed games to get Top Player
                events.forEach(event => {
                    const game = event.competitions[0];
                    
                    const summaryPromise = (game.status.type.state === 'post') 
                        ? fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${encodeURIComponent(SPORT_PATH)}/summary?event=${encodeURIComponent(game.id)}`).then(r => r.json())
                        : Promise.resolve(null);
                    const pickPromise = (USER_UID && typeof db !== 'undefined') 
                        ? db.collection(COLLECTION_NAME).doc(String(event.id)).get().catch(() => null)
                        : Promise.resolve(null);

                    Promise.all([summaryPromise, pickPromise]).then(([summary, pickDoc]) => {
                            if (summary && summary.boxscore && summary.boxscore.players) {
                                const teamStats = summary.boxscore.players.find(p => p.team.id === TEAM_ID);
                                if (teamStats && teamStats.statistics && teamStats.statistics[0]) {
                                    const statsData = teamStats.statistics[0];
                                    const labels = statsData.names;
                                    const athletes = statsData.athletes;
                                    
                                    let maxVal = -Infinity;
                                    let topPlayer = null;
                                    let topPlayerId = null;

                                    athletes.forEach(player => {
                                        const val = calculateVal(player.stats, labels);
                                        if (val > maxVal) {
                                            maxVal = val;
                                            topPlayer = player.athlete ? (player.athlete.shortName || player.athlete.displayName) : player.displayName;
                                            topPlayerId = player.athlete ? player.athlete.id : null;
                                        }
                                    });

                                    if (topPlayer) {
                                        const cell = document.getElementById(`val-${game.id}`);
                                        const cardCell = document.getElementById(`val-card-${game.id}`);
                                        const topPlayerStr = `<strong>${escapeHtml(topPlayer)}</strong> (${maxVal})`;
                                        if (cell) {
                                            cell.innerHTML = topPlayerStr;
                                            cell.style.color = '';
                                        }
                                        if (cardCell) {
                                            cardCell.innerHTML = topPlayerStr;
                                        }
                                    }

                                    // Update Pick VAL if pick exists
                                    if (pickDoc && pickDoc.exists) {
                                        const pickedPlayerId = pickDoc.data()[USER_UID];
                                        if (pickedPlayerId) {
                                            const player = athletes.find(p => p.athlete && String(p.athlete.id) === String(pickedPlayerId));
                                            if (player) {
                                                const val = calculateVal(player.stats, labels);
                                                const pickCell = document.getElementById(`pick-${game.id}`);
                                                const pickCardCell = document.getElementById(`pick-card-${game.id}`);
                                                const pickChip = document.getElementById(`pick-chip-${game.id}`);
                                                const playerName = player.athlete ? (player.athlete.shortName || player.athlete.displayName) : (playerMap[pickedPlayerId] || 'Unknown');
                                                const pickStr = `<strong>${escapeHtml(playerName)}</strong> (${val})`;

                                                if (pickCell) {
                                                    pickCell.innerHTML = pickStr;
                                                    pickCell.style.color = '';
                                                    if (topPlayerId && String(pickedPlayerId) === String(topPlayerId)) {
                                                        pickCell.classList.add('correct-pick');
                                                    }
                                                }
                                                if (pickCardCell) {
                                                    pickCardCell.innerHTML = pickStr;
                                                    if (topPlayerId && String(pickedPlayerId) === String(topPlayerId) && pickChip) {
                                                        pickChip.classList.add('correct-pick');
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }

                            // Handle Pick Name (if not already handled by VAL update or if game not complete)
                            if (pickDoc && pickDoc.exists) {
                                const pickedPlayerId = pickDoc.data()[USER_UID];
                                if (pickedPlayerId) {
                                    const pickCell = document.getElementById(`pick-${game.id}`);
                                    const pickCardCell = document.getElementById(`pick-card-${game.id}`);
                                    if (pickCell && pickCell.textContent === '-') {
                                        const playerName = playerMap[pickedPlayerId] || 'Unknown';
                                        const valDisplay = (game.status.type.state === 'post') ? ' (0)' : '';
                                        const pickNameStr = `<strong>${escapeHtml(playerName)}</strong>${valDisplay}`;
                                        pickCell.innerHTML = pickNameStr;
                                        pickCell.style.color = '';
                                        if (pickCardCell) {
                                            pickCardCell.innerHTML = pickNameStr;
                                        }
                                    }
                                }
                            }
                    });
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('schedule-content').innerHTML = 'Error loading schedule.';
            });
        });
    </script>
