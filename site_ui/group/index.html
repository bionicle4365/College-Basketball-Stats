---
layout: default
title: Groups
permalink: /groups/
---
    <div class="groups-container">
        <div id="groups-main-view">
            <h2>Groups</h2>
            
            <div class="section">
                <h3>Create Group</h3>
                <form class="input-group" onsubmit="event.preventDefault(); createGroup()">
                    <input type="text" id="new-group-name" placeholder="Enter group name" autocomplete="off">
                    <label style="display: flex; align-items: center; gap: 5px; white-space: nowrap;">
                        <input type="checkbox" id="new-group-private" onchange="togglePasswordInput()"> Private
                    </label>
                    <input type="password" id="new-group-password" placeholder="Password" style="display:none;" autocomplete="new-password">
                    <button type="submit" class="btn btn-primary">Create</button>
                </form>
            </div>

            <div class="section">
                <h3>My Groups</h3>
                <div id="my-groups-list">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <div class="section">
                <h3>Available Groups</h3>
                <div id="available-groups-list">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>

        <div id="single-group-view" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <button class="btn btn-secondary" onclick="window.location.hash = ''">&larr; Back to Groups</button>
                <button class="btn btn-secondary" id="share-group-btn" onclick="copyGroupLink()">🔗 Share Group Link</button>
            </div>
            
            <div id="single-group-header"></div>
            <div id="single-group-highlights"></div>

            <div class="group-tabs">
                <button class="group-tab-btn active" id="tab-btn-leaderboard" onclick="switchGroupTab('leaderboard')">Leaderboard</button>
                <button class="group-tab-btn" id="tab-btn-matrix" onclick="switchGroupTab('matrix')">Game-by-Game Picks</button>
            </div>

            <div id="tab-content-leaderboard">
                <div id="single-group-leaderboard"></div>
            </div>

            <div id="tab-content-matrix" style="display:none;">
                <div id="single-group-matrix"></div>
            </div>
        </div>
    </div>

    <!-- Member Pick History Modal -->
    <div id="member-picks-modal" class="modal-overlay" onclick="closeMemberModal(event)">
        <div class="modal-box">
            <span class="modal-close" onclick="closeMemberModal(event)">&times;</span>
            <div id="member-picks-modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- Group Privacy Settings Modal (Owner Only) -->
    <div id="group-privacy-modal" class="modal-overlay" onclick="closePrivacyModal(event)">
        <div class="modal-box" style="max-width: 480px; width: 92%; padding: 22px 24px;">
            <span class="modal-close" onclick="closePrivacyModal(event)">&times;</span>
            <div id="group-privacy-modal-body"></div>
        </div>
    </div>

    <script>
        checkAuth();
        const { teamId: TEAM_ID, league: LEAGUE, sportPath: SPORT_PATH } = getAppContext();
        let USER_UID = null;
        let currentGroupData = null;
        let groupMemberStats = {};
        let groupGamesData = [];

        if (typeof auth !== 'undefined' && auth) {
            auth.onAuthStateChanged(user => {
                if (user) {
                    USER_UID = user.uid;
                    handleRouting();
                } else {
                    window.location.href = '/College-Basketball-Stats/login';
                }
            });
        }

        window.addEventListener('hashchange', handleRouting);

        function handleRouting() {
            const groupId = window.location.hash.substring(1);
            if (groupId) {
                loadGroupDetail(groupId);
            } else {
                loadGroups();
            }
        }

        function togglePasswordInput() {
            const isPrivate = document.getElementById('new-group-private').checked;
            const passwordInput = document.getElementById('new-group-password');
            passwordInput.style.display = isPrivate ? 'block' : 'none';
        }

        function copyGroupLink() {
            const btn = document.getElementById('share-group-btn');
            navigator.clipboard.writeText(window.location.href).then(() => {
                const originalText = btn.textContent;
                btn.textContent = '✓ Link Copied!';
                setTimeout(() => btn.textContent = originalText, 2000);
            }).catch(() => {
                alert('Group link: ' + window.location.href);
            });
        }

        function switchGroupTab(tab) {
            const lbTab = document.getElementById('tab-content-leaderboard');
            const matrixTab = document.getElementById('tab-content-matrix');
            const lbBtn = document.getElementById('tab-btn-leaderboard');
            const matrixBtn = document.getElementById('tab-btn-matrix');

            if (tab === 'leaderboard') {
                lbTab.style.display = 'block';
                matrixTab.style.display = 'none';
                lbBtn.classList.add('active');
                matrixBtn.classList.remove('active');
            } else {
                lbTab.style.display = 'none';
                matrixTab.style.display = 'block';
                lbBtn.classList.remove('active');
                matrixBtn.classList.add('active');
            }
        }

        function getGroupOwnerId(groupData) {
            if (!groupData) return null;
            if (groupData.ownerId) return groupData.ownerId;
            if (groupData.creatorId) return groupData.creatorId;
            if (Array.isArray(groupData.members) && groupData.members.length > 0) {
                return groupData.members[0];
            }
            return null;
        }

        function isGroupOwner(groupData, uid) {
            if (!groupData || !uid) return false;
            return getGroupOwnerId(groupData) === uid;
        }

        async function createGroup() {
            const nameInput = document.getElementById('new-group-name');
            const name = nameInput.value.trim();
            const isPrivate = document.getElementById('new-group-private').checked;
            const password = document.getElementById('new-group-password').value.trim();

            if (!name) return alert('Please enter a group name');
            if (isPrivate && !password) return alert('Please enter a password for private group');

            try {
                const snapshot = await db.collection('groups').where('name', '==', name).get();
                if (!snapshot.empty) {
                    alert('Group name already exists. Please choose another.');
                    return;
                }

                let passwordHash = null;
                let salt = null;
                if (isPrivate) {
                    salt = generateSalt(16);
                    passwordHash = await hashPassword(password, salt);
                }

                const docRef = await db.collection('groups').add({
                    name: name,
                    teamId: TEAM_ID,
                    league: LEAGUE,
                    ownerId: USER_UID,
                    members: [USER_UID],
                    isPrivate: isPrivate,
                    passwordHash: passwordHash,
                    salt: salt,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                nameInput.value = '';
                document.getElementById('new-group-private').checked = false;
                document.getElementById('new-group-password').value = '';
                togglePasswordInput();
                window.location.hash = docRef.id;
            } catch (err) {
                console.error("Error creating group: ", err);
                alert('Error creating group');
            }
        }

        async function joinGroup(groupId, isPrivate) {
            if (isPrivate) {
                const enteredPassword = prompt("Enter group password:");
                if (!enteredPassword) return;
                
                try {
                    const doc = await db.collection('groups').doc(groupId).get();
                    if (doc.exists) {
                        const groupData = doc.data();
                        let isValid = false;

                        if (groupData.passwordHash) {
                            isValid = await verifyPassword(enteredPassword, groupData.salt || '', groupData.passwordHash);
                        }

                        if (isValid) {
                            addToGroup(groupId);
                        } else {
                            alert("Incorrect password");
                        }
                    }
                } catch (e) {
                    console.error("Error joining group:", e);
                    alert("Error joining group");
                }
            } else {
                addToGroup(groupId);
            }
        }

        function addToGroup(groupId) {
            if (typeof db === 'undefined' || !db) return alert("Database is currently unavailable.");
            db.collection('groups').doc(groupId).update({
                members: firebase.firestore.FieldValue.arrayUnion(USER_UID)
            }).then(() => {
                window.location.hash = groupId;
            }).catch(err => {
                console.error("Error joining group:", err);
                alert("Failed to join group. Please try again.");
            });
        }

        function loadGroups() {
            document.getElementById('groups-main-view').style.display = 'block';
            document.getElementById('single-group-view').style.display = 'none';
            if (typeof db === 'undefined' || !db) {
                document.getElementById('my-groups-list').innerHTML = '<p class="error">Firebase database is unavailable.</p>';
                document.getElementById('available-groups-list').innerHTML = '<p class="error">Firebase database is unavailable.</p>';
                return;
            }
            db.collection('groups')
                .where('teamId', '==', TEAM_ID)
                .where('league', '==', LEAGUE)
                .get()
                .then(snapshot => {
                    const myGroups = [];
                    const availableGroups = [];

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        data.id = doc.id;
                        if (data.members && data.members.includes(USER_UID)) {
                            myGroups.push(data);
                        } else {
                            availableGroups.push(data);
                        }
                    });

                    renderGroups('my-groups-list', myGroups, true);
                    renderGroups('available-groups-list', availableGroups, false);
                })
                .catch(err => {
                    console.error("Error loading groups:", err);
                    document.getElementById('my-groups-list').innerHTML = '<p class="error">Failed to load groups. Please try again.</p>';
                    document.getElementById('available-groups-list').innerHTML = '<p class="error">Failed to load groups. Please try again.</p>';
                });
        }

        function renderGroups(containerId, groups, isMember) {
            const container = document.getElementById(containerId);
            if (groups.length === 0) {
                container.innerHTML = '<p style="color: #888; font-style: italic;">No groups found.</p>';
                return;
            }

            container.innerHTML = groups.map(group => {
                const isPrivate = group.isPrivate || false;
                const lockIcon = isPrivate ? '🔒 ' : '';
                const memberCount = group.members?.length || 0;
                const safeName = escapeHtml(group.name);
                const isOwner = isGroupOwner(group, USER_UID);
                const ownerBadge = isOwner ? '<span class="group-owner-pill" style="font-size: 0.7rem; padding: 1px 6px;">👑 Owner</span>' : '';
                return `
                <div class="group-card">
                    <div>
                        <div class="group-name">${lockIcon}${safeName}</div>
                        <div style="font-size: 0.85em; color: #666; margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                            <span class="group-badge-pill">${group.league === 'womens' ? 'NCAA-W' : 'NCAA-M'}</span>
                            <span>${memberCount} member${memberCount === 1 ? '' : 's'}</span>
                            ${ownerBadge}
                        </div>
                    </div>
                    ${isMember ? 
                        `<button class="btn btn-secondary view-group-btn" data-group-id="${escapeHtml(group.id)}">View Group &rarr;</button>` : 
                        `<button class="btn btn-primary join-group-btn" data-group-id="${escapeHtml(group.id)}" data-is-private="${isPrivate ? 'true' : 'false'}">Join</button>`
                    }
                </div>
            `}).join('');
        }

        document.getElementById('groups-main-view').addEventListener('click', (e) => {
            const viewBtn = e.target.closest('.view-group-btn');
            if (viewBtn && viewBtn.dataset.groupId) {
                navigateToGroup(viewBtn.dataset.groupId);
                return;
            }
            const joinBtn = e.target.closest('.join-group-btn');
            if (joinBtn && joinBtn.dataset.groupId) {
                joinGroup(joinBtn.dataset.groupId, joinBtn.dataset.isPrivate === 'true');
                return;
            }
        });

        function navigateToGroup(id) {
            window.location.hash = id;
        }

        async function loadGroupDetail(groupId) {
            document.getElementById('groups-main-view').style.display = 'none';
            document.getElementById('single-group-view').style.display = 'block';
            
            const headerContainer = document.getElementById('single-group-header');
            const highlightsContainer = document.getElementById('single-group-highlights');
            const lbContainer = document.getElementById('single-group-leaderboard');
            const matrixContainer = document.getElementById('single-group-matrix');

            headerContainer.innerHTML = '<div class="loading">Loading group details...</div>';
            highlightsContainer.innerHTML = '';
            lbContainer.innerHTML = '';
            matrixContainer.innerHTML = '';

            try {
                const doc = await db.collection('groups').doc(groupId).get();
                if (!doc.exists) {
                    headerContainer.innerHTML = '<div class="error">Group not found.</div>';
                    return;
                }
                
                currentGroupData = doc.data();
                currentGroupData.id = doc.id;

                if (!currentGroupData.members || !currentGroupData.members.includes(USER_UID)) {
                    headerContainer.innerHTML = `
                        <div class="error" style="padding: 20px; text-align: center;">
                            <h3>You are not a member of this group.</h3>
                            <button class="btn btn-primary" id="detail-join-group-btn">Join Group</button>
                        </div>
                    `;
                    const detailJoinBtn = document.getElementById('detail-join-group-btn');
                    if (detailJoinBtn) {
                        detailJoinBtn.onclick = () => joinGroup(groupId, Boolean(currentGroupData.isPrivate));
                    }
                    return;
                }

                // Check ownership and auto-backfill ownerId for existing groups if missing
                const isOwner = isGroupOwner(currentGroupData, USER_UID);
                if (isOwner && !currentGroupData.ownerId && typeof db !== 'undefined' && db) {
                    db.collection('groups').doc(groupId).update({ ownerId: USER_UID })
                        .then(() => {
                            currentGroupData.ownerId = USER_UID;
                        })
                        .catch(err => {
                            console.warn('Could not auto-backfill ownerId:', err);
                        });
                }

                // Render Header
                renderGroupHeader(currentGroupData);

                // Calculate group stats and render leaderboard
                await renderRichGroupData(currentGroupData);

            } catch (e) {
                console.error("Error loading group detail:", e);
                headerContainer.innerHTML = '<div class="error">Error loading group data.</div>';
            }
        }

        function renderGroupHeader(groupData) {
            const headerContainer = document.getElementById('single-group-header');
            if (!headerContainer || !groupData) return;

            const leagueTag = groupData.league === 'womens' ? 'NCAA Women' : 'NCAA Men';
            const lockBadge = groupData.isPrivate ? '🔒 Private Group' : '🌐 Public Group';
            const isOwner = isGroupOwner(groupData, USER_UID);
            const ownerPill = isOwner ? '<span class="group-owner-pill">👑 Group Owner</span>' : '';
            const privacyBtn = isOwner ? `
                <button type="button" class="btn btn-secondary btn-sm group-privacy-btn" onclick="openPrivacyModal()">
                    ${groupData.isPrivate ? '⚙️ Privacy Settings' : '🔒 Change to Private Group'}
                </button>
            ` : '';

            headerContainer.innerHTML = `
                <div class="group-header-card">
                    <div class="group-meta">
                        <img src="https://a.espncdn.com/i/teamlogos/ncaa/500/${escapeHtml(groupData.teamId)}.png" class="group-team-badge" alt="">
                        <div>
                            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                                <h2 style="margin: 0; font-size: 1.4rem;">${escapeHtml(groupData.name)}</h2>
                                ${ownerPill}
                            </div>
                            <div style="display: flex; gap: 8px; align-items: center; font-size: 0.85rem; color: #666; margin-top: 4px; flex-wrap: wrap;">
                                <span class="group-badge-pill">${leagueTag}</span>
                                <span class="group-badge-pill" id="group-privacy-status-pill">${lockBadge}</span>
                                <span>${(groupData.members || []).length} Members</span>
                            </div>
                        </div>
                    </div>
                    <div class="group-header-actions">
                        ${privacyBtn}
                    </div>
                </div>
            `;
        }

        async function fetchUserProfiles(uids) {
            const profiles = {};
            const fetchPromises = uids.map(uid => 
                db.collection('user_settings').doc(uid).get()
                    .then(doc => {
                        if (doc.exists) {
                            profiles[uid] = doc.data();
                        } else {
                            profiles[uid] = {};
                        }
                    })
                    .catch(() => {
                        profiles[uid] = {};
                    })
            );
            await Promise.all(fetchPromises);
            return profiles;
        }

        async function renderRichGroupData(groupData) {
            const highlightsContainer = document.getElementById('single-group-highlights');
            const lbContainer = document.getElementById('single-group-leaderboard');
            const matrixContainer = document.getElementById('single-group-matrix');
            
            lbContainer.innerHTML = '<div class="loading">Calculating stats and compiling leaderboard...</div>';

            try {
                const members = groupData.members || [];
                const teamId = groupData.teamId || TEAM_ID;
                const league = groupData.league || LEAGUE;
                const sportPath = getSportPath(league);
                const collectionName = getCollectionName(teamId, league);

                // 1. Fetch user profiles in parallel
                const userProfiles = await fetchUserProfiles(members);

                // 2. Fetch completed schedule
                const scheduleData = await fetchTeamSchedule(sportPath, teamId);
                const completedEvents = (scheduleData.events || []).filter(e => e.competitions?.[0]?.status?.type?.state === 'post');

                // Initialize member stats store
                groupMemberStats = {};
                members.forEach(uid => {
                    groupMemberStats[uid] = {
                        uid: uid,
                        displayName: userProfiles[uid]?.displayName || (uid === USER_UID ? 'You' : `Member ${uid.substring(0, 5)}`),
                        favoriteTeamId: userProfiles[uid]?.favoriteTeamId || teamId,
                        totalPoints: 0,
                        picksCount: 0,
                        topPicksCount: 0,
                        picks: {},
                        bestPick: null
                    };
                });

                // 3. Process each completed game
                groupGamesData = [];

                const gamePromises = completedEvents.map(async (event) => {
                    const gameId = String(event.id);
                    const comp = event.competitions[0];
                    const oppTeam = comp.competitors.find(c => String(c.team.id) !== String(teamId))?.team;
                    const gameDate = new Date(event.date);

                    const [summaryResp, pickDoc] = await Promise.all([
                        fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${sportPath}/summary?event=${gameId}`).then(r => r.json()).catch(() => null),
                        db.collection(collectionName).doc(gameId).get().catch(() => null)
                    ]);

                    if (!summaryResp || !summaryResp.boxscore || !summaryResp.boxscore.players) return;

                    const teamStats = summaryResp.boxscore.players.find(p => String(p.team.id) === String(teamId));
                    if (!teamStats || !teamStats.statistics || !teamStats.statistics[0]) return;

                    const athletes = teamStats.statistics[0].athletes;
                    const labels = teamStats.statistics[0].names;

                    // Calculate VAL for all players in this game
                    const playerValMap = {};
                    let topPlayerId = null;
                    let topPlayerName = '';
                    let topVal = -Infinity;

                    athletes.forEach(p => {
                        if (p.athlete && p.stats) {
                            const val = calculateVal(p.stats, labels);
                            const name = p.athlete.shortName || p.athlete.displayName;
                            playerValMap[p.athlete.id] = { val: val, name: name };
                            if (val > topVal) {
                                topVal = val;
                                topPlayerId = String(p.athlete.id);
                                topPlayerName = name;
                            }
                        }
                    });

                    const picks = (pickDoc && pickDoc.exists) ? pickDoc.data() : {};

                    // Assign stats to members
                    members.forEach(uid => {
                        const pickedPlayerId = picks[uid];
                        if (pickedPlayerId && playerValMap[pickedPlayerId]) {
                            const pData = playerValMap[pickedPlayerId];
                            const isTop = String(pickedPlayerId) === String(topPlayerId);
                            
                            groupMemberStats[uid].totalPoints += pData.val;
                            groupMemberStats[uid].picksCount += 1;
                            if (isTop) groupMemberStats[uid].topPicksCount += 1;

                            const pickInfo = {
                                gameId: gameId,
                                date: gameDate,
                                opponent: oppTeam?.shortDisplayName || oppTeam?.displayName || 'Opponent',
                                opponentLogo: oppTeam?.logos?.[0]?.href || '',
                                playerId: pickedPlayerId,
                                playerName: pData.name,
                                val: pData.val,
                                isTopPlayer: isTop,
                                topPlayerName: topPlayerName,
                                topPlayerVal: topVal
                            };

                            groupMemberStats[uid].picks[gameId] = pickInfo;

                            if (!groupMemberStats[uid].bestPick || pData.val > groupMemberStats[uid].bestPick.val) {
                                groupMemberStats[uid].bestPick = pickInfo;
                            }
                        }
                    });

                    groupGamesData.push({
                        id: gameId,
                        date: gameDate,
                        opponent: oppTeam?.shortDisplayName || oppTeam?.displayName || 'Opponent',
                        opponentLogo: oppTeam?.logos?.[0]?.href || '',
                        topPlayerName: topPlayerName,
                        topPlayerVal: topVal,
                        picks: picks,
                        playerValMap: playerValMap
                    });
                });

                await Promise.all(gamePromises);

                // Sort games chronologically
                groupGamesData.sort((a, b) => b.date - a.date);

                // Convert member stats to array and sort by totalPoints descending
                const sortedMemberList = Object.values(groupMemberStats).sort((a, b) => b.totalPoints - a.totalPoints);

                // 4. Render Highlights
                if (sortedMemberList.length > 0 && completedEvents.length > 0) {
                    const leader = sortedMemberList[0];
                    
                    const accuracyRanked = [...sortedMemberList]
                        .filter(m => m.picksCount > 0)
                        .sort((a, b) => (b.topPicksCount / b.picksCount) - (a.topPicksCount / a.picksCount));
                    const accuracyKing = accuracyRanked[0];

                    let bestOverallPick = null;
                    let bestPicker = null;
                    sortedMemberList.forEach(m => {
                        if (m.bestPick && (!bestOverallPick || m.bestPick.val > bestOverallPick.val)) {
                            bestOverallPick = m.bestPick;
                            bestPicker = m;
                        }
                    });

                    highlightsContainer.innerHTML = `
                        <div class="group-stats-grid">
                            <div class="group-stat-card">
                                <div class="group-stat-title">🏆 Current Leader</div>
                                <div class="group-stat-value">${escapeHtml(leader.displayName)}</div>
                                <div class="group-stat-sub">${leader.totalPoints} VAL Points</div>
                            </div>
                            <div class="group-stat-card">
                                <div class="group-stat-title">🎯 Top Pick King</div>
                                <div class="group-stat-value">${accuracyKing ? escapeHtml(accuracyKing.displayName) : '-'}</div>
                                <div class="group-stat-sub">${accuracyKing ? `${accuracyKing.topPicksCount} Top Picks (${((accuracyKing.topPicksCount / accuracyKing.picksCount) * 100).toFixed(0)}%)` : 'No picks yet'}</div>
                            </div>
                            <div class="group-stat-card">
                                <div class="group-stat-title">⚡ Best Single Pick</div>
                                <div class="group-stat-value">${bestOverallPick ? `+${bestOverallPick.val}` : '-'}</div>
                                <div class="group-stat-sub">${bestOverallPick ? `${escapeHtml(bestPicker.displayName)} (${escapeHtml(bestOverallPick.playerName)})` : 'No picks yet'}</div>
                            </div>
                        </div>
                    `;
                }

                // 5. Render Leaderboard Table
                let lbHtml = `
                    <div style="overflow-x: auto;">
                        <table class="leaderboard-table">
                            <thead>
                                <tr>
                                    <th style="width: 40px; text-align: center;">Rank</th>
                                    <th>Member</th>
                                    <th style="text-align: center;">Total VAL</th>
                                    <th style="text-align: center;">Picks Made</th>
                                    <th style="text-align: center;">Top Pick %</th>
                                    <th style="text-align: center;">Avg VAL</th>
                                    <th style="text-align: center;">Recent Form</th>
                                    <th style="text-align: center;">Details</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                sortedMemberList.forEach((member, index) => {
                    const rankNum = index + 1;
                    let rankDisplay = `<span style="font-weight:bold; color:#777;">${rankNum}</span>`;
                    if (rankNum === 1) rankDisplay = `<span class="rank-badge rank-1">1</span>`;
                    else if (rankNum === 2) rankDisplay = `<span class="rank-badge rank-2">2</span>`;
                    else if (rankNum === 3) rankDisplay = `<span class="rank-badge rank-3">3</span>`;

                    const isYou = member.uid === USER_UID;
                    const youBadge = isYou ? `<span class="user-you-tag">You</span>` : '';
                    const isOwner = isGroupOwner(currentGroupData, member.uid);
                    const ownerBadge = isOwner ? `<span class="user-owner-tag">👑 Owner</span>` : '';
                    const avatarLetter = escapeHtml((member.displayName || 'U').charAt(0).toUpperCase());

                    const avgVal = member.picksCount > 0 ? (member.totalPoints / member.picksCount).toFixed(1) : '-';
                    const topRate = member.picksCount > 0 ? `${member.topPicksCount} (${((member.topPicksCount / member.picksCount) * 100).toFixed(0)}%)` : '-';

                    // Recent Form pills (last 3-4 games)
                    let trendHtml = '<div class="trend-container">';
                    const recentGames = groupGamesData.slice(0, 4);
                    if (recentGames.length === 0) {
                        trendHtml += `<span class="trend-pill trend-none">-</span>`;
                    } else {
                        recentGames.forEach(g => {
                            const pick = member.picks[g.id];
                            if (pick) {
                                const cls = pick.isTopPlayer ? 'trend-top' : 'trend-normal';
                                const star = pick.isTopPlayer ? '★' : '';
                                const safePlayer = escapeHtml(pick.playerName);
                                trendHtml += `<span class="trend-pill ${cls}" title="${safePlayer}: +${pick.val} VAL">${star}+${pick.val}</span>`;
                            } else {
                                trendHtml += `<span class="trend-pill trend-none" title="No Pick">-</span>`;
                            }
                        });
                    }
                    trendHtml += '</div>';

                    lbHtml += `
                        <tr class="clickable-row member-row" data-member-uid="${escapeHtml(member.uid)}">
                            <td style="text-align: center;">${rankDisplay}</td>
                            <td>
                                <div class="user-cell">
                                    <div class="user-avatar">${avatarLetter}</div>
                                    <strong style="font-size: 0.95rem;">${escapeHtml(member.displayName)}</strong>
                                    ${ownerBadge}
                                    ${youBadge}
                                </div>
                            </td>
                            <td style="text-align: center; font-weight: bold; font-size: 1.1rem; color: #cc0000;">${member.totalPoints}</td>
                            <td style="text-align: center;">${member.picksCount} / ${completedEvents.length}</td>
                            <td style="text-align: center;">${topRate}</td>
                            <td style="text-align: center;">${avgVal}</td>
                            <td style="text-align: center;">${trendHtml}</td>
                            <td style="text-align: center;">
                                <button class="btn btn-secondary view-member-btn" style="padding: 4px 10px; font-size: 0.8rem;" data-member-uid="${escapeHtml(member.uid)}">View</button>
                            </td>
                        </tr>
                    `;
                });

                lbHtml += `</tbody></table></div>`;
                lbContainer.innerHTML = lbHtml;

                lbContainer.onclick = (e) => {
                    const row = e.target.closest('.member-row');
                    if (row && row.dataset.memberUid) {
                        openMemberModal(row.dataset.memberUid);
                    }
                };

                // 6. Render Game-by-Game Matrix Tab
                let matrixHtml = `
                    <div style="overflow-x: auto;">
                        <table class="game-matrix-table">
                            <thead>
                                <tr>
                                    <th>Date & Opponent</th>
                                    <th>Top Performer</th>
                                    ${sortedMemberList.map(m => `<th style="text-align: center;">${escapeHtml(m.displayName)}${isGroupOwner(currentGroupData, m.uid) ? ' 👑' : ''}${m.uid === USER_UID ? ' (You)' : ''}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                `;

                if (groupGamesData.length === 0) {
                    matrixHtml += `<tr><td colspan="${sortedMemberList.length + 2}" style="text-align:center; padding: 20px; color:#888;">No completed games yet.</td></tr>`;
                } else {
                    groupGamesData.forEach(game => {
                        const dateStr = game.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                        const safeOppLogo = game.opponentLogo ? sanitizeUrl(game.opponentLogo) : '';
                        const oppLogo = safeOppLogo ? `<img src="${safeOppLogo}" width="18" height="18" style="vertical-align: middle; margin-right: 5px;">` : '';

                        let memberPicksCells = sortedMemberList.map(member => {
                            const pick = member.picks[game.id];
                            if (pick) {
                                const cls = pick.isTopPlayer ? 'background-color: rgba(40, 167, 69, 0.15); border-radius: 4px;' : '';
                                const crown = pick.isTopPlayer ? ' 👑' : '';
                                return `<td style="text-align: center; padding: 6px; ${cls}">
                                    <div style="font-weight: 500; font-size: 0.85rem;">${escapeHtml(pick.playerName)}</div>
                                    <div style="font-weight: bold; color: ${pick.isTopPlayer ? '#28a745' : '#666'}; font-size: 0.85rem;">+${pick.val}${crown}</div>
                                </td>`;
                            } else {
                                return `<td style="text-align: center; color: #bbb; font-size: 0.85rem;">-</td>`;
                            }
                        }).join('');

                        matrixHtml += `
                            <tr>
                                <td><strong>${dateStr}</strong> vs ${oppLogo}${escapeHtml(game.opponent)}</td>
                                <td><span style="color: #28a745; font-weight: bold;">${escapeHtml(game.topPlayerName)}</span> (${game.topPlayerVal})</td>
                                ${memberPicksCells}
                            </tr>
                        `;
                    });
                }

                matrixHtml += `</tbody></table></div>`;
                matrixContainer.innerHTML = matrixHtml;

            } catch (e) {
                console.error("Error calculating group stats:", e);
                lbContainer.innerHTML = '<div class="error">Error loading group statistics. Please try again later.</div>';
            }
        }

        function openMemberModal(uid) {
            const member = groupMemberStats[uid];
            if (!member) return;

            const modal = document.getElementById('member-picks-modal');
            const modalBody = document.getElementById('member-picks-modal-body');

            const isYou = uid === USER_UID;
            const youTag = isYou ? '<span class="user-you-tag">You</span>' : '';
            const avgVal = member.picksCount > 0 ? (member.totalPoints / member.picksCount).toFixed(1) : '0.0';

            const sortedPicks = Object.values(member.picks).sort((a, b) => b.date - a.date);

            let tableRows = '';
            if (sortedPicks.length === 0) {
                tableRows = `<tr><td colspan="5" style="text-align:center; padding: 20px; color:#888;">No picks made in this group yet.</td></tr>`;
            } else {
                tableRows = sortedPicks.map(p => {
                    const dateStr = p.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    const safeOppLogo = p.opponentLogo ? sanitizeUrl(p.opponentLogo) : '';
                    const oppLogo = safeOppLogo ? `<img src="${safeOppLogo}" width="16" height="16" style="vertical-align: middle; margin-right: 4px;">` : '';
                    const valBadge = p.isTopPlayer 
                        ? `<span style="background: #d4edda; color: #155724; padding: 2px 6px; border-radius: 4px; font-weight: bold;">+${p.val} 👑</span>`
                        : `<span style="font-weight: bold;">+${p.val}</span>`;

                    return `
                        <tr>
                            <td>${dateStr}</td>
                            <td>${oppLogo}${escapeHtml(p.opponent)}</td>
                            <td><strong>${escapeHtml(p.playerName)}</strong></td>
                            <td style="text-align: center;">${valBadge}</td>
                            <td style="text-align: right; color: #666; font-size: 0.85em;">${escapeHtml(p.topPlayerName)} (${p.topPlayerVal})</td>
                        </tr>
                    `;
                }).join('');
            }

            modalBody.innerHTML = `
                <div style="border-bottom: 1px solid #eee; padding-bottom: 12px; margin-bottom: 15px;">
                    <h3 style="margin: 0 0 5px 0; font-size: 1.2rem;">${escapeHtml(member.displayName)} ${youTag}</h3>
                    <div style="display: flex; gap: 15px; font-size: 0.85rem; color: #666; flex-wrap: wrap;">
                        <span>Total: <strong style="color: #cc0000;">${member.totalPoints} VAL</strong></span>
                        <span>Picks: <strong>${member.picksCount}</strong></span>
                        <span>Top Picks: <strong>${member.topPicksCount}</strong></span>
                        <span>Avg: <strong>${avgVal}</strong></span>
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table class="leaderboard-table" style="font-size: 0.85rem;">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Opponent</th>
                                <th>Pick</th>
                                <th style="text-align: center;">VAL</th>
                                <th style="text-align: right;">Team Top Player</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                </div>
            `;

            modal.style.display = 'flex';
        }

        function closeMemberModal(event) {
            if (!event || event.target.id === 'member-picks-modal' || event.target.classList.contains('modal-close')) {
                document.getElementById('member-picks-modal').style.display = 'none';
            }
        }

        function openPrivacyModal() {
            if (!currentGroupData || !isGroupOwner(currentGroupData, USER_UID)) {
                return alert("Only the group owner can modify privacy settings.");
            }

            const modal = document.getElementById('group-privacy-modal');
            const body = document.getElementById('group-privacy-modal-body');
            const isPrivate = Boolean(currentGroupData.isPrivate);

            if (!isPrivate) {
                // Change from Public to Private
                body.innerHTML = `
                    <div style="margin-bottom: 16px;">
                        <h3 style="margin: 0 0 6px 0; font-size: 1.25rem;">🔒 Change to Private Group</h3>
                        <p style="color: #666; font-size: 0.88rem; line-height: 1.4; margin: 0;">
                            Make <strong>${escapeHtml(currentGroupData.name)}</strong> private so new members must enter a password to join. Existing members remain in the group.
                        </p>
                    </div>

                    <form onsubmit="event.preventDefault(); submitMakePrivate();">
                        <div style="margin-bottom: 12px;">
                            <label for="privacy-modal-password" style="display: block; font-size: 0.82rem; font-weight: bold; margin-bottom: 4px;">Group Password</label>
                            <input type="password" id="privacy-modal-password" placeholder="Enter group password" autocomplete="new-password" style="width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;" required>
                        </div>

                        <div style="margin-bottom: 10px;">
                            <label for="privacy-modal-password-confirm" style="display: block; font-size: 0.82rem; font-weight: bold; margin-bottom: 4px;">Confirm Password</label>
                            <input type="password" id="privacy-modal-password-confirm" placeholder="Confirm password" autocomplete="new-password" style="width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;" required>
                        </div>

                        <label style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #555; margin-bottom: 16px; cursor: pointer; user-select: none;">
                            <input type="checkbox" onchange="togglePrivacyModalPassword()"> Show password
                        </label>

                        <div id="privacy-modal-error" style="color: #c62828; font-size: 0.85rem; margin-bottom: 12px; font-weight: bold; display: none;"></div>

                        <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #eee; padding-top: 14px;">
                            <button type="button" class="btn btn-secondary" onclick="closePrivacyModal()">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="btn-save-privacy">🔒 Save &amp; Make Private</button>
                        </div>
                    </form>
                `;
            } else {
                // Group is already Private
                body.innerHTML = `
                    <div style="margin-bottom: 16px;">
                        <h3 style="margin: 0 0 6px 0; font-size: 1.25rem;">⚙️ Group Privacy Settings</h3>
                        <p style="color: #666; font-size: 0.88rem; line-height: 1.4; margin: 0;">
                            <strong>${escapeHtml(currentGroupData.name)}</strong> is currently <strong>🔒 Private</strong>.
                        </p>
                    </div>

                    <form onsubmit="event.preventDefault(); submitChangePassword();" style="margin-bottom: 20px;">
                        <h4 style="margin: 0 0 10px 0; font-size: 0.95rem;">Change Group Password</h4>
                        <div style="margin-bottom: 12px;">
                            <label for="privacy-modal-password" style="display: block; font-size: 0.82rem; font-weight: bold; margin-bottom: 4px;">New Password</label>
                            <input type="password" id="privacy-modal-password" placeholder="Enter new password" autocomplete="new-password" style="width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;" required>
                        </div>

                        <div style="margin-bottom: 10px;">
                            <label for="privacy-modal-password-confirm" style="display: block; font-size: 0.82rem; font-weight: bold; margin-bottom: 4px;">Confirm New Password</label>
                            <input type="password" id="privacy-modal-password-confirm" placeholder="Confirm new password" autocomplete="new-password" style="width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;" required>
                        </div>

                        <label style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #555; margin-bottom: 14px; cursor: pointer; user-select: none;">
                            <input type="checkbox" onchange="togglePrivacyModalPassword()"> Show password
                        </label>

                        <div id="privacy-modal-error" style="color: #c62828; font-size: 0.85rem; margin-bottom: 12px; font-weight: bold; display: none;"></div>

                        <button type="submit" class="btn btn-primary" id="btn-change-password">🔑 Update Password</button>
                    </form>

                    <div style="border-top: 1px solid #eee; padding-top: 16px;">
                        <h4 style="margin: 0 0 6px 0; font-size: 0.95rem;">Convert to Public Group</h4>
                        <p style="font-size: 0.85rem; color: #666; margin: 0 0 12px 0;">
                            Anyone with the link or browsing the group list will be able to join without entering a password.
                        </p>
                        <button type="button" class="btn btn-secondary" onclick="submitMakePublic()" style="color: #c62828; border-color: #f5c2c2;">
                            🌐 Convert to Public Group
                        </button>
                    </div>
                `;
            }

            modal.style.display = 'flex';
            setTimeout(() => {
                const input = document.getElementById('privacy-modal-password');
                if (input) input.focus();
            }, 100);
        }

        function closePrivacyModal(event) {
            if (!event || event.target.id === 'group-privacy-modal' || event.target.classList.contains('modal-close')) {
                const modal = document.getElementById('group-privacy-modal');
                if (modal) modal.style.display = 'none';
            }
        }

        function togglePrivacyModalPassword() {
            const p1 = document.getElementById('privacy-modal-password');
            const p2 = document.getElementById('privacy-modal-password-confirm');
            const isShowing = p1 && p1.type === 'text';
            if (p1) p1.type = isShowing ? 'password' : 'text';
            if (p2) p2.type = isShowing ? 'password' : 'text';
        }

        async function submitMakePrivate() {
            const p1 = document.getElementById('privacy-modal-password')?.value.trim();
            const p2 = document.getElementById('privacy-modal-password-confirm')?.value.trim();
            const btn = document.getElementById('btn-save-privacy');

            if (!p1) {
                showPrivacyModalError('Please enter a password.');
                return;
            }
            if (p1.length < 3) {
                showPrivacyModalError('Password must be at least 3 characters.');
                return;
            }
            if (p1 !== p2) {
                showPrivacyModalError('Passwords do not match.');
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Saving...';
            }

            try {
                const salt = generateSalt(16);
                const passwordHash = await hashPassword(p1, salt);
                const updatePayload = {
                    isPrivate: true,
                    passwordHash: passwordHash,
                    salt: salt,
                    ownerId: USER_UID
                };

                await db.collection('groups').doc(currentGroupData.id).update(updatePayload);

                currentGroupData.isPrivate = true;
                currentGroupData.passwordHash = passwordHash;
                currentGroupData.salt = salt;
                currentGroupData.ownerId = USER_UID;

                renderGroupHeader(currentGroupData);
                closePrivacyModal();
                alert('✓ Success! Your group is now private.');
            } catch (err) {
                console.error('Error changing group to private:', err);
                showPrivacyModalError('Failed to update group privacy. Please try again.');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '🔒 Save & Make Private';
                }
            }
        }

        async function submitChangePassword() {
            const p1 = document.getElementById('privacy-modal-password')?.value.trim();
            const p2 = document.getElementById('privacy-modal-password-confirm')?.value.trim();
            const btn = document.getElementById('btn-change-password');

            if (!p1) {
                showPrivacyModalError('Please enter a new password.');
                return;
            }
            if (p1.length < 3) {
                showPrivacyModalError('Password must be at least 3 characters.');
                return;
            }
            if (p1 !== p2) {
                showPrivacyModalError('Passwords do not match.');
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Updating...';
            }

            try {
                const salt = generateSalt(16);
                const passwordHash = await hashPassword(p1, salt);
                const updatePayload = {
                    passwordHash: passwordHash,
                    salt: salt,
                    ownerId: USER_UID
                };

                await db.collection('groups').doc(currentGroupData.id).update(updatePayload);

                currentGroupData.passwordHash = passwordHash;
                currentGroupData.salt = salt;
                currentGroupData.ownerId = USER_UID;

                closePrivacyModal();
                alert('✓ Group password updated successfully!');
            } catch (err) {
                console.error('Error changing group password:', err);
                showPrivacyModalError('Failed to update password. Please try again.');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '🔑 Update Password';
                }
            }
        }

        async function submitMakePublic() {
            if (!confirm(`Are you sure you want to make "${currentGroupData.name}" public? Anyone will be able to join without entering a password.`)) {
                return;
            }

            try {
                const updatePayload = {
                    isPrivate: false,
                    passwordHash: null,
                    salt: null,
                    ownerId: USER_UID
                };

                await db.collection('groups').doc(currentGroupData.id).update(updatePayload);

                currentGroupData.isPrivate = false;
                currentGroupData.passwordHash = null;
                currentGroupData.salt = null;
                currentGroupData.ownerId = USER_UID;

                renderGroupHeader(currentGroupData);
                closePrivacyModal();
                alert('✓ Success! Your group is now public.');
            } catch (err) {
                console.error('Error converting group to public:', err);
                alert('Failed to update group privacy. Please try again.');
            }
        }

        function showPrivacyModalError(msg) {
            const errEl = document.getElementById('privacy-modal-error');
            if (errEl) {
                errEl.textContent = msg;
                errEl.style.display = 'block';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const memberModal = document.getElementById('member-picks-modal');
                const privacyModal = document.getElementById('group-privacy-modal');
                if (memberModal) memberModal.style.display = 'none';
                if (privacyModal) privacyModal.style.display = 'none';
            }
        });
    </script>
