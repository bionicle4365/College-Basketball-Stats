---
layout: default
title: Groups
permalink: /groups/
---
    <div class="groups-container">
        <div id="groups-main-view">
            <h2>Groups</h2>
            
            <div class="section">
                <h3>Create Group</h3>
                <form class="input-group" onsubmit="event.preventDefault(); createGroup()">
                    <input type="text" id="new-group-name" placeholder="Enter group name" autocomplete="off">
                    <label style="display: flex; align-items: center; gap: 5px; white-space: nowrap;">
                        <input type="checkbox" id="new-group-private" onchange="togglePasswordInput()"> Private
                    </label>
                    <input type="password" id="new-group-password" placeholder="Password" style="display:none;" autocomplete="new-password">
                    <button type="submit" class="btn btn-primary">Create</button>
                </form>
            </div>

            <div class="section">
                <h3>My Groups</h3>
                <div id="my-groups-list">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <div class="section">
                <h3>Available Groups</h3>
                <div id="available-groups-list">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>

        <div id="single-group-view" style="display:none;">
            <button class="btn btn-secondary" onclick="window.location.hash = ''" style="margin-bottom: 15px;">&larr; Back to Groups</button>
            <h2 id="single-group-name"></h2>
            <div id="single-group-leaderboard"></div>
        </div>
    </div>

    <script>
        const TEAM_ID = getFavoriteTeamId();
        const LEAGUE = getLeague();
        const SPORT_PATH = getSportPath();
        let USER_UID = null;

        auth.onAuthStateChanged(user => {
            if (user) {
                USER_UID = user.uid;
                handleRouting();
            } else {
                window.location.href = '/College-Basketball-Stats/login';
            }
        });

        window.addEventListener('hashchange', handleRouting);

        function handleRouting() {
            const groupId = window.location.hash.substring(1); // Remove the '#'
            if (groupId) {
                loadGroupDetail(groupId);
            } else {
                loadGroups();
            }
        }

        function togglePasswordInput() {
            const isPrivate = document.getElementById('new-group-private').checked;
            const passwordInput = document.getElementById('new-group-password');
            passwordInput.style.display = isPrivate ? 'block' : 'none';
        }

        function createGroup() {
            const nameInput = document.getElementById('new-group-name');
            const name = nameInput.value.trim();
            const isPrivate = document.getElementById('new-group-private').checked;
            const password = document.getElementById('new-group-password').value.trim();

            if (!name) return alert('Please enter a group name');
            if (isPrivate && !password) return alert('Please enter a password for private group');

            db.collection('groups').where('name', '==', name).get().then(snapshot => {
                if (!snapshot.empty) {
                    alert('Group name already exists. Please choose another.');
                    return;
                }

                db.collection('groups').add({
                    name: name,
                    teamId: TEAM_ID,
                    league: LEAGUE,
                    members: [USER_UID],
                    isPrivate: isPrivate,
                    password: isPrivate ? password : null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    nameInput.value = '';
                    document.getElementById('new-group-private').checked = false;
                    document.getElementById('new-group-password').value = '';
                    togglePasswordInput();
                    loadGroups();
                }).catch(err => {
                    console.error("Error creating group: ", err);
                    alert('Error creating group');
                });
            });
        }

        function joinGroup(groupId, isPrivate) {
            if (isPrivate) {
                const password = prompt("Enter group password:");
                if (!password) return;
                
                db.collection('groups').doc(groupId).get().then(doc => {
                    if (doc.exists) {
                        const groupData = doc.data();
                        if (groupData.password === password) {
                            addToGroup(groupId);
                        } else {
                            alert("Incorrect password");
                        }
                    }
                });
            } else {
                addToGroup(groupId);
            }
        }

        function addToGroup(groupId) {
            db.collection('groups').doc(groupId).update({
                members: firebase.firestore.FieldValue.arrayUnion(USER_UID)
            }).then(() => {
                loadGroups();
            });
        }

        function loadGroups() {
            document.getElementById('groups-main-view').style.display = 'block';
            document.getElementById('single-group-view').style.display = 'none';
            db.collection('groups')
                .where('teamId', '==', TEAM_ID)
                .where('league', '==', LEAGUE)
                .get()
                .then(snapshot => {
                    const myGroups = [];
                    const availableGroups = [];

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        data.id = doc.id;
                        if (data.members && data.members.includes(USER_UID)) {
                            myGroups.push(data);
                        } else {
                            availableGroups.push(data);
                        }
                    });

                    renderGroups('my-groups-list', myGroups, true);
                    renderGroups('available-groups-list', availableGroups, false);
                });
        }

        function renderGroups(containerId, groups, isMember) {
            const container = document.getElementById(containerId);
            if (groups.length === 0) {
                container.innerHTML = '<p>No groups found.</p>';
                return;
            }

            container.innerHTML = groups.map(group => {
                const isPrivate = group.isPrivate || false;
                const lockIcon = isPrivate ? '🔒 ' : '';
                return `
                <div class="group-card">
                    <div>
                        <div class="group-name">${lockIcon}${group.name}</div>
                        <div style="font-size: 0.9em; color: #666;">${group.members.length} members</div>
                    </div>
                    ${isMember ? 
                        `<button class="btn btn-secondary" onclick="navigateToGroup('${group.id}')">View Group</button>` : 
                        `<button class="btn btn-primary" onclick="joinGroup('${group.id}', ${isPrivate})">Join</button>`
                    }
                </div>
            `}).join('');
        }

        function navigateToGroup(id) {
            window.location.hash = id;
        }

        function loadGroupDetail(groupId) {
            document.getElementById('groups-main-view').style.display = 'none';
            document.getElementById('single-group-view').style.display = 'block';
            document.getElementById('single-group-name').textContent = 'Loading...';
            const container = document.getElementById('single-group-leaderboard');
            container.innerHTML = '<div class="loading">Loading leaderboard...</div>';

            db.collection('groups').doc(groupId).get().then(doc => {
                if (!doc.exists) {
                    container.innerHTML = 'Group not found.';
                    document.getElementById('single-group-name').textContent = 'Group Not Found';
                    return;
                }
                const groupData = doc.data();
                document.getElementById('single-group-name').textContent = groupData.name;
                
                if (!groupData.members.includes(USER_UID)) {
                    container.innerHTML = 'You are not a member of this group.';
                    return;
                }

                renderLeaderboard(container, groupData.members);
            });
        }

        async function renderLeaderboard(container, members) {
            
            try {
                const scheduleResp = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${getSportPath()}/teams/${TEAM_ID}/schedule`);
                const scheduleData = await scheduleResp.json();
                const completedGames = (scheduleData.events || []).filter(e => e.competitions[0].status.type.state === 'post');

                const scores = {};
                members.forEach(m => scores[m] = 0);

                const collectionName = getCollectionName(TEAM_ID, LEAGUE);

                const gamePromises = completedGames.map(async (event) => {
                    const gameId = event.id;
                    const pickDoc = await db.collection(collectionName).doc(gameId).get().catch(() => null);
                    if (!pickDoc || !pickDoc.exists) return;
                    const picks = pickDoc.data();

                    const summaryResp = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${getSportPath()}/summary?event=${gameId}`);
                    const summary = await summaryResp.json();
                    if (!summary.boxscore || !summary.boxscore.players) return;
                    
                    const teamStats = summary.boxscore.players.find(p => p.team.id === TEAM_ID);
                    if (!teamStats) return;

                    const athletes = teamStats.statistics[0].athletes;
                    const labels = teamStats.statistics[0].names;

                    const playerVals = {};
                    athletes.forEach(p => {
                        if (p.athlete) playerVals[p.athlete.id] = calculateVal(p.stats, labels);
                    });

                    members.forEach(uid => {
                        const pickedPlayerId = picks[uid];
                        if (pickedPlayerId && playerVals[pickedPlayerId]) {
                            scores[uid] += playerVals[pickedPlayerId];
                        }
                    });
                });

                await Promise.all(gamePromises);

                const sortedMembers = members.sort((a, b) => scores[b] - scores[a]);
                
                let html = `<table class="leaderboard-table"><thead><tr><th>Rank</th><th>User</th><th>Points</th></tr></thead><tbody>`;
                sortedMembers.forEach((uid, index) => {
                    const displayName = uid === USER_UID ? 'You' : `Member ${uid.substr(0, 4)}...`;
                    html += `<tr><td>${index + 1}</td><td>${displayName}</td><td>${scores[uid]}</td></tr>`;
                });
                html += `</tbody></table>`;
                
                container.innerHTML = html;

            } catch (e) {
                console.error(e);
                container.innerHTML = 'Error loading leaderboard.';
            }
        }
    </script>
