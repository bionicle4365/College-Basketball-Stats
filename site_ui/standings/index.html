---
layout: default
title: Standings
permalink: /standings/
---
<div class="standings-container">
    <h2 id="conf-name">Conference Standings</h2>
    <div id="standings-content">
        <div class="loading">Loading standings...</div>
    </div>
</div>

<script>
    checkAuth();

    const { teamId: TEAM_ID, sportPath: SPORT_PATH } = getAppContext();

    // Fetch Standings
    fetch(`https://site.api.espn.com/apis/v2/sports/basketball/${SPORT_PATH}/standings`)
        .then(r => r.json())
        .then(data => {
            let standings = [];
            let confName = data.name || 'Conference Standings';

            if (data.children && data.children.length > 0) {
                let matchedConf = data.children.find(child => {
                    const entries = child.standings?.entries || [];
                    return entries.some(e => String(e.team?.id) === String(TEAM_ID));
                });
                if (!matchedConf) {
                    matchedConf = data.children[0];
                }
                if (matchedConf) {
                    confName = matchedConf.name || confName;
                    standings = matchedConf.standings?.entries || [];
                }
            } else if (data.standings && data.standings.entries) {
                standings = data.standings.entries;
            } else if (Array.isArray(data.standings)) {
                standings = data.standings;
            }

            document.getElementById('conf-name').textContent = confName;

            if (!standings || standings.length === 0) {
                document.getElementById('standings-content').innerHTML = '<div class="no-data">No standings available.</div>';
                return;
            }

            standings.sort((a, b) => {
                const getRank = (entry) => {
                    const r = (entry.stats || []).find(s => s.type === 'playoffseed');
                    return r ? parseFloat(r.value) : 999;
                };
                return getRank(a) - getRank(b);
            });

            let html = `<table class="standings-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Team</th>
                        <th>Conf</th>
                        <th>Overall</th>
                    </tr>
                </thead>
                <tbody>`;

            standings.forEach((entry, index) => {
                const team = entry.team || {};
                const stats = entry.stats || [];
                const apRank = team.rank ? escapeHtml(team.rank) + ' ' : '';
                const confRank = stats.find(r => r.type === 'playoffseed');
                const isMyTeam = String(team.id) === String(TEAM_ID);
                const confRecord = stats.find(r => r.type === 'vsconf') || { summary: '-' };
                const overallRecord = stats.find(r => r.type === 'total') || { summary: '-' };

                html += `<tr class="${isMyTeam ? 'highlight-team' : ''}">
                    <td>${confRank ? escapeHtml(confRank.displayValue) : (index + 1)}</td>
                    <td>${getTeamLogoHtml(team)} ${apRank}${escapeHtml(team.shortDisplayName || team.displayName || 'Unknown')}</td>
                    <td>${escapeHtml(confRecord.summary)}</td>
                    <td>${escapeHtml(overallRecord.summary)}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            document.getElementById('standings-content').innerHTML = html;
        })
        .catch(err => {
            console.error(err);
            document.getElementById('standings-content').innerHTML = '<div class="error">Failed to load standings.</div>';
        });
</script>
