---
layout: default
title: Scoreboard
permalink: /scoreboard/
---
<div class="stats-container">
  <div id="game-display" class="game-card">
    <div class="loading">Loading stats...</div>
  </div>
  <div id="val-modal" class="modal-overlay" onclick="closeValModal(event)">
    <div class="modal-box">
        <span class="modal-close" onclick="closeValModal(event)">&times;</span>
        <div id="val-modal-body" class="modal-body"></div>
    </div>
  </div>
</div>

<script>
  checkAuth();
  const TEAM_ID = getFavoriteTeamId();
  let USER_UID = null;

  const ENDPOINTS = {
    mens: 'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard',
    womens: 'https://site.api.espn.com/apis/site/v2/sports/basketball/womens-college-basketball/scoreboard'
  };

  function showValBreakdown(element) {
      const breakdown = element.getAttribute('data-breakdown');
      if (breakdown) {
          document.getElementById('val-modal-body').textContent = breakdown;
          document.getElementById('val-modal').style.display = 'flex';
      }
  }

  function closeValModal(event) {
      if (event.target.id === 'val-modal' || event.target.classList.contains('modal-close')) {
          document.getElementById('val-modal').style.display = 'none';
      }
  }

  function fetchPick(gameId, type) {
      if (!USER_UID) return Promise.resolve(null);
      const collectionName = getCollectionName(TEAM_ID, type);
      return db.collection(collectionName).doc(String(gameId)).get()
          .then(doc => doc.exists ? doc.data()[USER_UID] : null)
          .catch(() => null);
  }

  function savePick(gameId, gameDateStr) {
      const select = document.getElementById('player-pick-select');
      const playerId = select.value;
      const message = document.getElementById('pick-message');
      
      if (!playerId) {
          message.textContent = "Please select a player.";
          message.style.color = "red";
          return;
      }

      if (gameDateStr) {
          const gameTime = new Date(gameDateStr).getTime();
          if (Date.now() > gameTime) {
              message.textContent = "Pick deadline passed (game has started).";
              message.style.color = "red";
              return;
          }
      }
      
      const league = getLeague();
      const collectionName = getCollectionName(TEAM_ID, league);
      
      db.collection(collectionName).doc(String(gameId)).set({
          [USER_UID]: playerId,
          [`${USER_UID}_time`]: Date.now()
      }, { merge: true })
      .then(() => {
          message.textContent = "Pick saved!";
          message.style.color = "green";
      })
      .catch((error) => {
          console.error("Error saving pick: ", error);
          message.textContent = "Error saving pick.";
          message.style.color = "red";
      });
  }

  let livePollInterval = null;
  let activeTeamTab = 0;

  function stopLivePolling() {
      if (livePollInterval) {
          clearInterval(livePollInterval);
          livePollInterval = null;
      }
  }

  function startLivePolling(type) {
      if (!livePollInterval) {
          livePollInterval = setInterval(() => {
              loadStats(type, true);
          }, 30000);
      }
  }

  function loadStats(type, isSilent = false) {
    localStorage.setItem('league', type);
    
    const display = document.getElementById('game-display');
    if (!isSilent) {
        display.innerHTML = '<div class="loading">Fetching latest scores...</div>';
    }

    const gameId = window.location.hash.substring(1);

    if (gameId) {
        const summaryUrl = ENDPOINTS[type].replace('scoreboard', 'summary') + '?event=' + gameId;
        fetch(summaryUrl).then(r => r.json()).then(summary => {
            const state = summary.header.competitions[0].status.type.state;
            if (state === 'in') {
                startLivePolling(type);
            } else {
                stopLivePolling();
            }
            const promises = [fetchPick(gameId, type)];
            
            if (state === 'pre') {
                 const sportPath = getSportPath(type);
                 promises.push(fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${sportPath}/teams/${TEAM_ID}?enable=roster`).then(r => r.json()));
            } else {
                 promises.push(Promise.resolve(null));
            }

            Promise.all(promises).then(([pickedPlayerId, rosterData]) => {
                if (summary && summary.header) {
                    renderGame(summary.header, summary, null, pickedPlayerId, rosterData, type);
                } else {
                    display.innerHTML = '<div class="error">Game data not available.</div>';
                }
            });
        }).catch(err => {
            console.error(err);
            if (!isSilent) display.innerHTML = '<div class="error">Error loading game data.</div>';
        });
        return;
    }

    fetch(ENDPOINTS[type])
      .then(response => response.json())
      .then(data => {
        const events = data.events || [];
        // Find the game involving user's team
        const game = events.find(evt => 
          evt.competitions[0].competitors.some(comp => comp.team.id === TEAM_ID)
        );

        // If game is live or final today, show it
        if (game) {
          const state = game.status.type.state;
          if (state === 'in') {
            startLivePolling(type);
          } else {
            stopLivePolling();
          }

          if (state === 'in' || state === 'post') {
            const summaryUrl = ENDPOINTS[type].replace('scoreboard', 'summary') + '?event=' + game.id;
            return Promise.all([
                fetch(summaryUrl).then(r => r.json()),
                fetchPick(game.id, type)
            ]).then(([summary, pickedPlayerId]) => renderGame(game, summary, null, pickedPlayerId, null, type));
          } else if (state === 'pre') {
             const sportPath = getSportPath(type);
             return Promise.all([
                 fetchPick(game.id, type),
                 fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${sportPath}/teams/${TEAM_ID}?enable=roster`).then(r => r.json())
             ]).then(([pickedPlayerId, rosterData]) => {
                 renderGame(game, null, null, pickedPlayerId, rosterData, type);
             });
          }
        }

        // Fallback: Find previous or upcoming game from schedule
        const sportPath = getSportPath(type);
        const scheduleUrl = `https://site.api.espn.com/apis/site/v2/sports/basketball/${sportPath}/teams/${TEAM_ID}/schedule`;
        
        return fetch(scheduleUrl)
          .then(r => r.json())
          .then(scheduleData => {
            const events = scheduleData.events || [];
            const today = new Date();
            
            // Priority: 1. Game in progress
            let targetGame = events.find(e => e.competitions[0].status.type.state === 'in');
            
            // 2. Game happening later today
            if (!targetGame) {
                targetGame = events.find(e => {
                    const state = e.competitions[0].status.type.state;
                    const gameDate = new Date(e.date);
                    return state === 'pre' && gameDate.toDateString() === today.toDateString();
                });
            }

            // 3. Previous game played
            if (!targetGame) {
                const completed = events.filter(e => e.competitions[0].status.type.state === 'post');
                targetGame = completed[completed.length - 1];
            }
            
            if (!targetGame) {
              stopLivePolling();
              display.innerHTML = '<p>No recent games found.</p>';
              return;
            }
            
            const nextGame = events.find(e => e.competitions[0].status.type.state === 'pre' && e.id !== targetGame.id);
            const state = targetGame.competitions[0].status.type.state;
            
            if (state === 'in') {
                startLivePolling(type);
            } else {
                stopLivePolling();
            }

            if (state === 'pre') {
                 const sportPath = getSportPath(type);
                 return Promise.all([
                     fetchPick(targetGame.id, type),
                     fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${sportPath}/teams/${TEAM_ID}?enable=roster`).then(r => r.json())
                 ]).then(([pickedPlayerId, rosterData]) => {
                     renderGame(targetGame, null, nextGame, pickedPlayerId, rosterData, type);
                 });
            } else {
                const summaryUrl = ENDPOINTS[type].replace('scoreboard', 'summary') + '?event=' + targetGame.id;
                return Promise.all([
                    fetch(summaryUrl).then(r => r.json()),
                    fetchPick(targetGame.id, type)
                ]).then(([summary, pickedPlayerId]) => renderGame(summary.header, summary, nextGame, pickedPlayerId, null, type));
            }
          });
      })
      .catch(err => {
        console.error(err);
        if (!isSilent) display.innerHTML = '<div class="error">Failed to load data. Please try again later.</div>';
      });
  }

  function getRecord(c) {
      const recs = c.records || c.record;
      if (!recs || !Array.isArray(recs) || recs.length === 0) return '';
      
      const totalRecord = recs.find(r => r.type === 'total');
      const confRecord = recs.find(r => r.type === 'vsconf');

      const parts = [];
      if (totalRecord && totalRecord.summary) {
          parts.push(totalRecord.summary);
      }
      if (confRecord && confRecord.summary) {
          parts.push(`(${confRecord.summary} Conf)`);
      }

      return parts.length > 0 ? parts.join(' ') : (recs[0]?.summary || '');
  }

  function renderLinescores(awayTeam, homeTeam) {
      const awayScores = awayTeam.linescores || [];
      const homeScores = homeTeam.linescores || [];
      if (awayScores.length === 0 && homeScores.length === 0) return '';

      const maxPeriods = Math.max(awayScores.length, homeScores.length);
      if (maxPeriods === 0) return '';

      let headerHtml = '<th>Team</th>';
      for (let i = 1; i <= maxPeriods; i++) {
          let colName = i === 1 ? '1st' : i === 2 ? '2nd' : 'OT';
          if (i > 3) colName = `OT${i - 2}`;
          headerHtml += `<th>${colName}</th>`;
      }
      headerHtml += '<th>T</th>';

      const buildRow = (c) => {
          let row = `<td style="text-align:left; font-weight:500;">${getTeamLogoHtml(c.team)} ${c.team.abbreviation || c.team.shortDisplayName}</td>`;
          for (let i = 0; i < maxPeriods; i++) {
              const val = c.linescores?.[i]?.displayValue ?? c.linescores?.[i]?.value ?? '-';
              row += `<td>${val}</td>`;
          }
          row += `<td style="font-weight:bold;">${c.score || 0}</td>`;
          return `<tr>${row}</tr>`;
      };

      return `
        <div class="linescores-wrapper">
          <table class="linescore-table">
            <thead><tr>${headerHtml}</tr></thead>
            <tbody>
              ${buildRow(awayTeam)}
              ${buildRow(homeTeam)}
            </tbody>
          </table>
        </div>
      `;
  }

  function renderGame(event, summaryData, nextGame, pickedPlayerId, rosterData, type) {
    const competition = event.competitions[0];
    const statusObj = event.status || competition.status;
    const status = statusObj.type.detail;
    const state = statusObj.type.state;
    const isLive = state === 'in';
    
    // Identify Home and Away
    const homeTeam = competition.competitors.find(c => c.homeAway === 'home');
    const awayTeam = competition.competitors.find(c => c.homeAway === 'away');
    const selectedTeam = competition.competitors.find(c => c.team.id == TEAM_ID) || homeTeam;
    const opponent = competition.competitors.find(c => c.team.id != TEAM_ID) || awayTeam;

    let nextGameHtml = '';
    if (nextGame) {
      const date = new Date(nextGame.date);
      const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const timeStr = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      const nextOpponent = nextGame.competitions[0].competitors.find(c => c.team.id !== TEAM_ID);
      const nextOpponentName = nextOpponent ? (nextOpponent.team.abbreviation || nextOpponent.team.shortDisplayName || nextOpponent.team.displayName) : 'TBD';
      
      nextGameHtml = `<div style="margin-top: 8px; font-size: 0.85em; color: #666;">Next: vs ${nextOpponentName} ${dateStr} ${timeStr}</div>`;
    }

    const getRank = (c) => {
      const rank = c.rank || c.curatedRank?.current;
      return (rank && rank <= 25) ? `#${rank} ` : '';
    };

    let statusBadgeHtml = `<div class="status">${status}</div>`;
    if (isLive) {
      statusBadgeHtml = `
        <div class="live-status-container">
          <div class="live-badge"><span class="live-pulse"></span> LIVE</div>
          <span class="live-clock-detail">${status}</span>
          <button class="live-refresh-btn" onclick="loadStats('${type || getLeague()}', true)" title="Refresh Live Data">&#x21bb; Live</button>
        </div>
      `;
    }

    // Linescores
    const linescoreHtml = (summaryData && (awayTeam.linescores || homeTeam.linescores)) ? renderLinescores(awayTeam, homeTeam) : '';

    // Last Play / Situation
    let lastPlayHtml = '';
    if (summaryData && summaryData.plays && summaryData.plays.length > 0) {
        const lastPlay = summaryData.plays[summaryData.plays.length - 1];
        if (lastPlay && (lastPlay.text || lastPlay.alternativeText)) {
            const clockText = lastPlay.clock?.displayValue ? `(${lastPlay.clock.displayValue}) ` : '';
            lastPlayHtml = `
              <div class="last-play-card">
                <span class="last-play-badge">Last Play</span>
                <span class="last-play-text">${clockText}${lastPlay.text || lastPlay.alternativeText}</span>
              </div>
            `;
        }
    }

    const display = document.getElementById('game-display');
    
    display.innerHTML = `
      ${statusBadgeHtml}
      <div class="score-board">
        <div class="team">
          ${getTeamLogoHtml(awayTeam.team)}
          <span class="team-name">${getRank(awayTeam)}${awayTeam.team.shortDisplayName || awayTeam.team.nickname || awayTeam.team.displayName}</span>
          <div class="team-record">${getRecord(awayTeam)}</div>
          <div class="team-score">${awayTeam.score || 0}</div>
        </div>
        <div class="vs">VS</div>
        <div class="team">
          ${getTeamLogoHtml(homeTeam.team)}
          <span class="team-name">${getRank(homeTeam)}${homeTeam.team.shortDisplayName || homeTeam.team.nickname || homeTeam.team.displayName}</span>
          <div class="team-record">${getRecord(homeTeam)}</div>
          <div class="team-score">${homeTeam.score || 0}</div>
        </div>
      </div>
      ${linescoreHtml}
      ${lastPlayHtml}
      ${nextGameHtml}
      <div id="stats-content">
        ${(summaryData && summaryData.boxscore && renderPlayerStats(summaryData, pickedPlayerId)) || renderTeamStats(selectedTeam, opponent, rosterData, pickedPlayerId, event.id, state, event.date)}
      </div>
    `;

    // Restore active tab if player stats were rendered
    if (summaryData && summaryData.boxscore && summaryData.boxscore.players) {
        const targetBtn = document.querySelector(`.btn-group button:nth-child(${activeTeamTab + 1})`);
        if (targetBtn) {
            toggleTeamStats(activeTeamTab, targetBtn);
        }
    }
  }

  function renderPlayerPicker(rosterData, pickedPlayerId, gameId, gameDate) {
      const athletes = rosterData.team.athletes.filter(p => p.active !== false);
      athletes.sort((a, b) => a.displayName.localeCompare(b.displayName));
      
      const options = athletes.map(p => {
          const selected = String(p.id) === String(pickedPlayerId) ? 'selected' : '';
          return `<option value="${escapeHtml(p.id)}" ${selected}>${escapeHtml(p.displayName)}</option>`;
      }).join('');
      
      const safeGameDate = gameDate ? escapeHtml(gameDate) : '';
      return `
        <div class="pick-container">
            <h3>Make Your Pick</h3>
            <p>Select a player for this game:</p>
            <div style="display: flex; justify-content: center; gap: 10px; align-items: center;">
                <select id="player-pick-select" class="pick-select">
                    <option value="">-- Select Player --</option>
                    ${options}
                </select>
                <button onclick="savePick('${escapeHtml(gameId)}', '${safeGameDate}')" style="padding: 8px 16px; background: #cc0000; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Save</button>
            </div>
            <div id="pick-message" style="margin-top: 10px; height: 20px; font-weight: bold;"></div>
        </div>
      `;
  }

  function renderTeamStats(team1, team2, rosterData, pickedPlayerId, gameId, state, gameDate) {
    // If no stats available (e.g. pre-game), return empty or basic record info
    if (state === 'pre' || !team1.statistics || team1.statistics.length === 0) {
      if (rosterData) {
          return renderPlayerPicker(rosterData, pickedPlayerId, gameId, gameDate);
      }
      return `<div class="leaders" style="text-align:center; margin-top:15px;">
        <p>Game has not started.</p>
        <p>${escapeHtml(team1.team.abbreviation)}: ${escapeHtml(getRecord(team1) || 'N/A')} | ${escapeHtml(team2.team.abbreviation)}: ${escapeHtml(getRecord(team2) || 'N/A')}</p>
      </div>`;
    }

    // Helper to find stat value by name
    const getStat = (team, name) => {
      const stat = team.statistics.find(s => s.name === name);
      return stat ? stat.displayValue : '-';
    };

    const statsToCompare = [
      { label: 'FG%', key: 'fieldGoalsPercentage' },
      { label: '3P%', key: 'threePointFieldGoalsPercentage' },
      { label: 'FT%', key: 'freeThrowsPercentage' },
      { label: 'Rebounds', key: 'totalRebounds' },
      { label: 'Assists', key: 'assists' },
      { label: 'Turnovers', key: 'turnovers' },
      { label: 'Steals', key: 'steals' },
      { label: 'Blocks', key: 'blocks' }
    ];

    let rows = statsToCompare.map(stat => `
      <tr>
        <td>${escapeHtml(getStat(team1, stat.key))}</td>
        <td style="font-weight:bold; color:#999; font-size:0.9em;">${escapeHtml(stat.label)}</td>
        <td>${escapeHtml(getStat(team2, stat.key))}</td>
      </tr>
    `).join('');

    return `
      <div class="section-title">Team Stats</div>
      <div style="overflow-x: auto;">
        <table class="stats-table">
          <thead>
            <tr>
              <th>${escapeHtml(team1.team.abbreviation)}</th>
              <th>Stat</th>
              <th>${escapeHtml(team2.team.abbreviation)}</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function toggleTeamStats(index, btn) {
    activeTeamTab = index;
    // Hide all stats containers
    document.querySelectorAll('[id^="team-stats-"]').forEach(el => el.style.display = 'none');
    // Show selected
    const target = document.getElementById('team-stats-' + index);
    if (target) target.style.display = 'block';
    
    // Update button states
    if (btn && btn.parentElement) {
        const group = btn.parentElement;
        group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
  }

  function renderPlayerStats(summary, pickedPlayerId) {
    if (!summary || !summary.boxscore || !summary.boxscore.players) return '';

    // Map requested columns to API labels
    // API labels in 'names': MIN, PTS, REB, AST, STL, BLK, TO, PF
    // We need to find the index in the 'stats' array for each player
    const targetStats = ['MIN', 'PTS', 'FG', '3PT', 'FT', 'REB', 'STL', 'AST', 'BLK', 'TO', 'PF'];
    
    const sortedPlayers = [...summary.boxscore.players].sort((a, b) => {
      return (a.team.id == TEAM_ID) ? -1 : (b.team.id == TEAM_ID) ? 1 : 0;
    });

    const teamHtmls = sortedPlayers.map((teamBox, index) => {
      const statsData = teamBox.statistics && teamBox.statistics[0];
      if (!statsData || !statsData.names || !statsData.athletes) return '';

      const labels = statsData.names;
      const indices = targetStats.map(stat => labels.indexOf(stat));
      
      const playersWithVal = statsData.athletes
        .filter(player => player.stats && player.stats.length > 0)
        .map(player => {
        const stats = player.stats;
        
        const score = calculateVal(stats, labels);

        return { player, stats, score };
      });

      playersWithVal.sort((a, b) => b.score - a.score);

      const rows = playersWithVal.map(({ player, stats, score }) => {
        const rawName = player.athlete ? (player.athlete.shortName || player.athlete.displayName) : (player.displayName || 'Team');
        const name = escapeHtml(rawName);
        const activeIndicator = player.active ? '🏀 ' : '';
        const cells = indices.map(idx => `<td>${idx !== -1 ? escapeHtml(stats[idx] || '0') : '-'}</td>`).join('');
        const tooltip = escapeHtml(getValTooltip(stats, labels));

        const isPicked = player.athlete && String(player.athlete.id) === String(pickedPlayerId);
        const rowClass = isPicked ? 'picked-row' : '';
        return `<tr class="${rowClass}">
          <td style="font-weight:bold;">${score}</td>
          <td style="text-align:left; white-space:nowrap; cursor:pointer;" onclick="showValBreakdown(this)" data-breakdown="${tooltip}">${activeIndicator}${name}</td>
          ${cells}
        </tr>`;
      }).join('');

      const displayStyle = index === 0 ? 'block' : 'none';
      return `
        <div id="team-stats-${index}" style="display: ${displayStyle};">
          <div style="overflow-x: auto;">
            <table class="stats-table">
              <thead><tr><th>VAL</th><th style="text-align:left;">Player</th>${targetStats.map(s => `<th>${s}</th>`).join('')}</tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    });

    const toggleButtons = sortedPlayers.map((teamBox, index) => {
      const activeClass = index === 0 ? 'active' : '';
      const teamName = teamBox.team.abbreviation || teamBox.team.shortDisplayName;
      return `<button class="${activeClass}" onclick="toggleTeamStats(${index}, this)">${teamName}</button>`;
    }).join('');

    return `<div class="controls" style="margin-top: 10px; margin-bottom: 10px;"><div class="btn-group">${toggleButtons}</div></div>` + teamHtmls.join('');
  }

  // Load Men's stats by default on page load
  auth.onAuthStateChanged(user => {
      if (user) {
          USER_UID = user.uid;
          loadStats(localStorage.getItem('league') || 'mens');
      }
  });

  window.addEventListener('hashchange', () => {
      stopLivePolling();
      loadStats(localStorage.getItem('league') || 'mens');
  });

  window.addEventListener('beforeunload', () => {
      stopLivePolling();
  });
</script>
