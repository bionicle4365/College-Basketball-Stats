---
layout: default
title: Roster Stats
permalink: /roster/
---
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <div class="roster-container">
        <h2 id="team-name">Team Roster & Stats</h2>
        <div id="player-content" style="overflow-x: auto;">
            <div class="loading">Loading players...</div>
        </div>
    </div>

    <script>
        checkAuth();

        const TEAM_ID = getFavoriteTeamId();
        const LEAGUE = getLeague();
        const SPORT_PATH = getSportPath();
        const chartInstances = {};

        let teamSchedule = [];
        fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${SPORT_PATH}/teams/${TEAM_ID}/schedule`)
            .then(r => r.json())
            .then(data => {
                 if (data.events) {
                    teamSchedule = data.events
                        .filter(e => e.competitions[0].status.type.completed)
                        .map(e => {
                            const date = new Date(e.date);
                            return {
                                id: e.id,
                                date: date,
                                label: date.toLocaleDateString('en-US', {month:'numeric', day:'numeric'})
                            };
                        })
                        .sort((a, b) => a.date - b.date);
                }
            });

        // Try to fetch roster
        const ROSTER_URL = `https://site.api.espn.com/apis/site/v2/sports/basketball/${SPORT_PATH}/teams/${TEAM_ID}?enable=roster,stats`;

        
        fetch(ROSTER_URL)
            .then(r => r.json())
            .then(data => {
                const teamName = escapeHtml(data.team.displayName);
                document.getElementById('team-name').textContent = teamName + ' Roster';
                const athletes = data.team.athletes;
                renderTable(['Pos', 'Height', 'Weight', 'Class', 'Birthplace'], athletes, 'roster');
            })
            .catch(e => {
                document.getElementById('roster-content').innerHTML = '<p>Error loading data.</p>';
        });

        function renderTable(headers, data, type) {
            let html = `<table class="roster-table"><thead><tr><th>Player</th>`;
            headers.forEach(h => html += `<th>${escapeHtml(h)}</th>`);
            html += `</tr></thead><tbody>`;

            data.forEach(item => {
                if (item.active === false) return;

                const player = type === 'stats' ? item.athlete : item;
                const stats = type === 'stats' ? item.stats : [
                    player.position?.abbreviation || '-',
                    player.displayHeight || '-',
                    player.displayWeight || '-',
                    player.experience?.abbreviation || '-',
                    player.birthPlace?.city ? `${player.birthPlace.city}, ${player.birthPlace.stateAbbrev || player.birthPlace.country}` : '-'
                ];

                const img = player.headshot ? escapeHtml(player.headshot.href) : 'https://a.espncdn.com/i/headshots/nophoto.png';
                const playerId = escapeHtml(player.id);
                const safeName = escapeHtml(player.displayName);
                const safeJersey = player.jersey ? escapeHtml(player.jersey) : '';
                
                html += `<tr class="player-row" onclick="toggleStats('${playerId}')" style="cursor: pointer;">
                    <td><img src="${img}" class="headshot"><strong>${safeName}</strong> <span style="color:#888; font-size:0.8em">#${safeJersey}</span></td>
                    ${stats.map(s => `<td>${escapeHtml(s)}</td>`).join('')}
                </tr>
                <tr id="stats-${playerId}" class="stats-row" style="display: none;">
                    <td colspan="${headers.length + 1}" style="padding: 15px;">
                        <div id="stats-content-${playerId}">
                            Loading...
                        </div>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('player-content').innerHTML = html;
        }

        function toggleStats(id) {
            const row = document.getElementById('stats-' + id);
            const content = document.getElementById('stats-content-' + id);
            
            if (row.style.display === 'none') {
                row.style.display = 'table-row';
                if (!content.hasAttribute('data-loaded')) {
                    const gamelogUrl = `https://site.web.api.espn.com/apis/common/v3/sports/basketball/${SPORT_PATH}/athletes/${id}/gamelog`;

                    fetch(gamelogUrl)
                        .then(r => r.json())
                        .then(gamelogData => {
                            // Process Gamelog for Chart
                            let chartHtml = '';
                            let chartData = null;
                            
                            if (gamelogData.seasonTypes) {
                                const season = gamelogData.seasonTypes.find(s => s.categories) || gamelogData.seasonTypes[0];
                                if (season && season.categories) {
                                    const cat = season.categories.find(c => c.name === 'offensive') || season.categories[0];
                                    if (cat && cat.events) {
                                        const labels = gamelogData.labels;
                                        const playerEvents = cat.events;
                                        const playerStatsMap = {};
                                        playerEvents.forEach(evt => {
                                            playerStatsMap[evt.eventId] = evt;
                                        });
                                        
                                        const gameLabels = [];
                                        const valData = [];

                                        teamSchedule.forEach(game => {
                                            gameLabels.push(game.label);
                                            let val = 0;
                                            const evt = playerStatsMap[game.id];

                                            if (evt && evt.stats) {
                                                val = calculateVal(evt.stats, labels);
                                            }
                                            valData.push(val);
                                        });
                                        
                                        chartData = { labels: gameLabels, data: valData };
                                        chartHtml = `<div class="chart-container"><canvas id="chart-${id}"></canvas></div>`;
                                    }
                                }
                            }

                            content.innerHTML = `
                                ${chartHtml}
                            `;
                            
                            if (chartData) {
                                const isDark = document.body.classList.contains('dark-mode');
                                const textColor = isDark ? '#e0e0e0' : '#666';
                                const gridColor = isDark ? '#444' : '#ddd';

                                chartInstances[id] = new Chart(document.getElementById(`chart-${id}`), {
                                    type: 'line',
                                    data: {
                                        labels: chartData.labels,
                                        datasets: [{
                                            label: 'VAL',
                                            data: chartData.data,
                                            borderColor: '#cc0000',
                                            backgroundColor: 'rgba(204, 0, 0, 0.1)',
                                            tension: 0.1,
                                            fill: true
                                        }]
                                    },
                                    options: {
                                        responsive: true,
                                        maintainAspectRatio: false,
                                        plugins: {
                                            legend: { display: false },
                                            title: { 
                                                display: true, 
                                                text: 'Value (VAL) per Game',
                                                color: textColor
                                            }
                                        },
                                        scales: {
                                            y: { 
                                                beginAtZero: true,
                                                ticks: { color: textColor },
                                                grid: { color: gridColor }
                                            },
                                            x: {
                                                ticks: { color: textColor },
                                                grid: { color: gridColor }
                                            }
                                        }
                                    }
                                });
                            }

                            content.setAttribute('data-loaded', 'true');
                        });
                }
            } else {
                row.style.display = 'none';
            }
        }

        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'class') {
                    const isDark = document.body.classList.contains('dark-mode');
                    const textColor = isDark ? '#e0e0e0' : '#666';
                    const gridColor = isDark ? '#444' : '#ddd';
                    
                    Object.values(chartInstances).forEach(chart => {
                        chart.options.plugins.title.color = textColor;
                        chart.options.scales.y.ticks.color = textColor;
                        chart.options.scales.x.ticks.color = textColor;
                        chart.options.scales.y.grid.color = gridColor;
                        chart.options.scales.x.grid.color = gridColor;
                        chart.update();
                    });
                }
            });
        });
        observer.observe(document.body, { attributes: true });
    </script>
