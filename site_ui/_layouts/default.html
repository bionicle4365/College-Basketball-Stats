<!DOCTYPE html>
<html>
<head>
    <title>{{ page.title }} - {{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .site-header { background: #333; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .site-title { color: white; text-decoration: none; font-weight: bold; font-size: 1.2rem; }
        .user-dropdown { position: relative; display: none;}
        .username-btn { background: none; border: none; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; padding: 0.5rem; display: flex; align-items: center; }
        .username-btn::after { content: " ▼"; font-size: 0.7em; margin-left: 5px; }
        .league-dropdown { position: relative; display: inline-block; margin-right: 15px; }
        .league-btn { background: none; border: none; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; padding: 0.5rem; display: flex; align-items: center; }
        .league-btn::after { content: " ▼"; font-size: 0.7em; margin-left: 5px; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 100%; background-color: white; min-width: 120px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); z-index: 1; border-radius: 4px; overflow: hidden; }
        .dropdown-content.show { display: block; }
        .dropdown-content button { color: #333; padding: 12px 16px; text-decoration: none; display: block; width: 100%; border: none; background: none; text-align: left; cursor: pointer; font-size: 0.9rem; }
        .dropdown-content button:hover { background-color: #f1f1f1; color: #cc0000; }
        .nav-links { display: flex; align-items: center; }
        .nav-links a { color: #ddd; text-decoration: none; margin-right: 15px; font-weight: 500; }
        .nav-links a:hover { color: white; }
        .mobile-menu-btn { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; margin-right: 10px; }

        @media (max-width: 768px) {
            .site-header { position: relative; }
            .mobile-menu-btn { display: block; }
            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: #333;
                flex-direction: column;
                align-items: flex-start;
                z-index: 1000;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            }
            .nav-links.show { display: flex; }
            .nav-links a { 
                margin: 0; 
                padding: 15px 20px; 
                width: 100%; 
                box-sizing: border-box; 
                border-top: 1px solid #444; 
            }
            .league-dropdown { margin: 0; width: 100%; border-top: 1px solid #444; }
            .league-btn { width: 100%; padding: 15px 20px; justify-content: flex-start; }
            .league-dropdown .dropdown-content { position: static; width: 100%; box-shadow: none; background-color: #444; }
            .league-dropdown .dropdown-content button { padding-left: 40px; color: #ddd; }
        }

        /* Dark Mode Styles */
        body.dark-mode { background-color: #121212; color: #e0e0e0; }
        body.dark-mode .groups-container, 
        body.dark-mode .schedule-container, 
        body.dark-mode .stats-container,
        body.dark-mode .roster-container,
        body.dark-mode .settings-container,
        body.dark-mode .game-card,
        body.dark-mode .dropdown-content,
        body.dark-mode #teams-dropdown,
        body.dark-mode #team-selector { 
            background-color: #1e1e1e !important; 
            color: #e0e0e0 !important; 
            border-color: #333 !important; 
        }
        body.dark-mode .schedule-table th,
        body.dark-mode .stats-table th,
        body.dark-mode .roster-table th,
        body.dark-mode .leaderboard-table th {
            background-color: #2d2d2d !important;
            color: #e0e0e0 !important;
            border-bottom-color: #444 !important;
        }
        body.dark-mode td, body.dark-mode th { border-bottom-color: #333 !important; }
        body.dark-mode .schedule-table tbody tr:hover,
        body.dark-mode .roster-table tbody tr:hover,
        body.dark-mode .team-option:hover,
        body.dark-mode .dropdown-content button:hover { background-color: #333 !important; color: #fff !important; }
        body.dark-mode input, body.dark-mode select { background-color: #2d2d2d; color: white; border: 1px solid #444; }
        body.dark-mode .dropdown-content button { color: #e0e0e0; }
        body.dark-mode .btn-secondary { background-color: #333 !important; color: #e0e0e0 !important; }
        body.dark-mode .group-card { border-color: #333 !important; }
        body.dark-mode #search-results { background-color: #1e1e1e; }
        body.dark-mode #search-results div:hover { background-color: #333 !important; }
        
        /* Dark Mode Text Visibility Fixes */
        body.dark-mode .team-score { color: #e0e0e0 !important; }
        body.dark-mode .correct-pick, 
        body.dark-mode .picked-row { 
            background-color: #1b3a1e !important; 
            color: #e0e0e0 !important; 
        }
        body.dark-mode table td { color: #e0e0e0; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    {% if jekyll.environment == "development" %}
    <script src="{{ site.baseurl }}/common.local.js"></script>
    {% else %}
    <script src="{{ site.baseurl }}/common.js"></script>
    {% endif %}
</head>
<body>
    <header class="site-header">
        <div style="display: flex; align-items: center;">
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
            <a href="/College-Basketball-Stats/" class="site-title" style="margin-right: 20px;">{{ site.title }}</a>
            <nav class="nav-links" id="nav-links">
                <div id="league-dropdown" class="league-dropdown">
                    <button id="league-display" class="league-btn" onclick="toggleDropdown('league-menu')">NCAA-M</button>
                    <div id="league-menu" class="dropdown-content" style="left: 0; right: auto;">
                        <button onclick="selectLeague('mens')">NCAA-M</button>
                        <button onclick="selectLeague('womens')">NCAA-W</button>
                    </div>
                </div>
                <a href="/College-Basketball-Stats/schedule">Schedule</a>
                <a href="/College-Basketball-Stats/scoreboard">Scoreboard</a>
                <a href="/College-Basketball-Stats/roster">Roster</a>
                <a href="/College-Basketball-Stats/groups">Groups</a>
            </nav>
        </div>
        <div id="user-dropdown" class="user-dropdown">
            <div style="position: relative;">
                <img id="user-team-logo" style="width: 3rem; height: 3rem; margin-right: 10px; display: none; background-color: white; border-radius: 50%; padding: 2px; cursor: pointer;" onclick="toggleTeamSelector()">
                <div id="team-selector" style="display:none; position: absolute; top: 110%; left: 50%; transform: translateX(-50%); background: white; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); border-radius: 4px; z-index: 1000; width: 250px; color: black;">
                    <input type="text" id="team-search-input" placeholder="Search Team" onkeyup="searchTeams()" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 3px; box-sizing: border-box; margin-bottom: 5px;">
                    <div id="search-results" style="max-height: 200px; overflow-y: auto;"></div>
                </div>
            </div>
            <button id="username-display" class="username-btn" onclick="toggleDropdown('user-menu')">User</button>
            <div id="user-menu" class="dropdown-content">
                <button onclick="window.location.href='/College-Basketball-Stats/settings'">Settings</button>
                <button onclick="toggleDarkMode()" id="dark-mode-toggle">Dark Mode: Off</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
    </header>
    <div id="game-banner" style="display:none;"></div>
    <div id="content">
        {{ content }}
    </div>
    <script>
        // Initialize league selection
        const currentLeague = localStorage.getItem('league') || 'mens';
        
        // Initialize Dark Mode
        const storedDarkMode = localStorage.getItem('darkMode');
        if (storedDarkMode === 'true' || (storedDarkMode === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark-mode');
        }

        document.getElementById('league-display').textContent = currentLeague === 'mens' ? 'NCAA-M' : 'NCAA-W';

        if (localStorage.getItem('isLoggedIn') === 'true') {
            const username = localStorage.getItem('username') || 'User';
            document.getElementById('username-display').textContent = username;
            
            const userDropdown = document.getElementById('user-dropdown');
            userDropdown.style.display = 'flex';
            userDropdown.style.alignItems = 'center';

            const teamId = localStorage.getItem('favoriteTeamId') || '152';
            const logo = document.getElementById('user-team-logo');
            logo.src = `https://a.espncdn.com/i/teamlogos/ncaa/500/${teamId}.png`;
            logo.style.display = 'block';
        }
        
        // Update Dark Mode Button Text
        const dmBtn = document.getElementById('dark-mode-toggle');
        if (dmBtn) {
            dmBtn.textContent = document.body.classList.contains('dark-mode') ? 'Dark Mode: On' : 'Dark Mode: Off';
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            document.getElementById('dark-mode-toggle').textContent = isDark ? 'Dark Mode: On' : 'Dark Mode: Off';
        }

        function toggleDropdown(id) {
            document.getElementById(id).classList.toggle("show");
        }

        function toggleMobileMenu() {
            document.getElementById('nav-links').classList.toggle('show');
        }

        function selectLeague(league) {
            localStorage.setItem('league', league);
            document.getElementById('league-display').textContent = league === 'mens' ? 'NCAA-M' : 'NCAA-W';
            window.location.href = window.location.pathname;
        }

        let allTeams = [];

        async function loadAllTeams() {
            if (allTeams.length > 0) return;
            const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/teams?limit=1000');
            const data = await response.json();
            if (data.sports && data.sports[0].leagues && data.sports[0].leagues[0].teams) {
                allTeams = data.sports[0].leagues[0].teams.map(t => t.team);
            }
        }

        function toggleTeamSelector() {
            const selector = document.getElementById('team-selector');
            if (selector.style.display === 'none') {
                selector.style.display = 'block';
                loadAllTeams();
                document.getElementById('team-search-input').focus();
            } else {
                selector.style.display = 'none';
            }
        }

        function searchTeams() {
            const query = document.getElementById('team-search-input').value.toLowerCase();
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = '';
            
            if (query.length < 2) return;

            const matches = allTeams.filter(t => t.displayName.toLowerCase().includes(query));
            
            matches.slice(0, 10).forEach(team => {
                const div = document.createElement('div');
                div.style.padding = '8px';
                div.style.cursor = 'pointer';
                div.style.borderBottom = '1px solid #eee';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.innerHTML = `<img src="${team.logos[0].href}" width="24" height="24" style="margin-right:8px"> ${team.displayName}`;
                div.onclick = () => selectTeam(team.id);
                div.onmouseover = () => div.style.backgroundColor = '#f5f5f5';
                div.onmouseout = () => div.style.backgroundColor = 'white';
                resultsDiv.appendChild(div);
            });
        }

        function selectTeam(teamId) {
            localStorage.setItem('favoriteTeamId', teamId);
            
            if (auth && auth.currentUser) {
                db.collection('user_settings').doc(auth.currentUser.uid).set({
                    favoriteTeamId: teamId
                }, { merge: true }).then(() => {
                    window.location.reload();
                });
            } else {
                window.location.reload();
            }
        }

        window.onclick = function(event) {
            if (!event.target.matches('.username-btn') && !event.target.matches('.league-btn')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
            if (!event.target.closest('#user-team-logo') && !event.target.closest('#team-selector')) {
                const selector = document.getElementById('team-selector');
                if (selector) selector.style.display = 'none';
            }
            if (!event.target.matches('.mobile-menu-btn') && !event.target.closest('.nav-links')) {
                const nav = document.getElementById('nav-links');
                if (nav && nav.classList.contains('show')) {
                    nav.classList.remove('show');
                }
            }
        }
        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');
            window.location.href = '/College-Basketball-Stats/login';
        }

        function goToGameBanner(league, gameId) {
            localStorage.setItem('league', league);
            window.location.href = `/College-Basketball-Stats/scoreboard?gameId=${gameId}`;
        }

        (function() {
            const FAV_TEAM_ID = localStorage.getItem('favoriteTeamId') || '152';
            if (localStorage.getItem('isLoggedIn') !== 'true') return;

            async function checkUpcomingGames() {
                const today = new Date();
                const leagues = ['mens', 'womens'];
                let upcomingGames = [];

                for (const league of leagues) {
                    const sportPath = league === 'womens' ? 'womens-college-basketball' : 'mens-college-basketball';
                    try {
                        const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${sportPath}/teams/${FAV_TEAM_ID}/schedule`);
                        const data = await response.json();
                        if (data.events) {
                            const nextGame = data.events.find(e => {
                                const gameDate = new Date(e.date);
                                return gameDate.toDateString() === today.toDateString() && gameDate > today;
                            });
                            
                            if (nextGame) {
                                let hasPick = false;
                                if (typeof db !== 'undefined' && typeof auth !== 'undefined') {
                                    const user = await new Promise(resolve => {
                                        if (auth.currentUser) resolve(auth.currentUser);
                                        else {
                                            const unsubscribe = auth.onAuthStateChanged(u => {
                                                unsubscribe();
                                                resolve(u);
                                            });
                                        }
                                    });

                                    if (user) {
                                        const collectionName = `${FAV_TEAM_ID}${league === 'mens' ? 'm' : 'w'}`;
                                        const doc = await db.collection(collectionName).doc(String(nextGame.id)).get().catch(() => null);
                                        if (doc && doc.exists && doc.data()[user.uid]) {
                                            hasPick = true;
                                        }
                                    }
                                }
                                
                                if (!hasPick) {
                                    upcomingGames.push({ game: nextGame, league: league, date: new Date(nextGame.date) });
                                }
                            }
                        }
                    } catch (e) { console.error(e); }
                }

                if (upcomingGames.length > 0) {
                    upcomingGames.sort((a, b) => a.date - b.date);
                    const target = upcomingGames[0];
                    const banner = document.getElementById('game-banner');
                    const timeStr = target.date.toLocaleTimeString([], {hour: 'numeric', minute:'2-digit'});
                    const leagueName = target.league === 'mens' ? "Men's" : "Women's";
                    const opponent = target.game.competitions[0].competitors.find(c => String(c.team.id) !== String(FAV_TEAM_ID));
                    const opponentName = opponent ? (opponent.team.shortDisplayName || opponent.team.displayName) : 'Opponent';
                    banner.innerHTML = `<div style="background-color: #cc0000; color: white; text-align: center; padding: 10px; cursor: pointer; font-weight: bold;" onclick="goToGameBanner('${target.league}', '${target.game.id}')">${leagueName} Team vs ${opponentName} today at ${timeStr} <span style="font-size: 0.9em; text-decoration: underline; margin-left: 10px;">Make Your Pick!</span></div>`;
                    banner.style.display = 'block';
                }
            }
            checkUpcomingGames();
        })();
    </script>
</body>
</html>
