<!DOCTYPE html>
<html>
<head>
    <title>{{ page.title }} - {{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#cc0000">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://a.espncdn.com; connect-src 'self' https://site.api.espn.com https://site.web.api.espn.com https://*.googleapis.com https://*.firebaseio.com https://*.firebase.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://*.firebaseapp.com; font-src 'self'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="manifest" href="{{ site.baseurl }}/manifest.json">
    <link rel="icon" href="https://a.espncdn.com/i/teamlogos/ncaa/500/152.png" type="image/png">
    <link rel="apple-touch-icon" href="https://a.espncdn.com/i/teamlogos/ncaa/500/152.png">
    <link rel="stylesheet" href="{{ site.baseurl }}/styles.css?v={{ site.time | date: '%s' }}">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    {% if jekyll.environment == "development" %}
    <script src="{{ site.baseurl }}/common.local.js?v={{ site.time | date: '%s' }}"></script>
    <script>console.log("Debug Mode: Using common.local.js");</script>
    {% else %}
    <script src="{{ site.baseurl }}/common.js?v={{ site.time | date: '%s' }}"></script>
    {% endif %}
    <script src="{{ site.baseurl }}/helpers.js?v={{ site.time | date: '%s' }}"></script>
</head>
<body>
    <header class="site-header">
        <div style="display: flex; align-items: center;">
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
            <a href="/College-Basketball-Stats/" class="site-title" style="margin-right: 20px;">{{ site.title }}</a>
            <nav class="nav-links" id="nav-links">
                <div id="league-dropdown" class="league-dropdown">
                    <button id="league-display" class="league-btn" onclick="toggleDropdown('league-menu')">NCAA-M</button>
                    <div id="league-menu" class="dropdown-content" style="left: 0; right: auto;">
                        <button onclick="selectLeague('mens')">NCAA-M</button>
                        <button onclick="selectLeague('womens')">NCAA-W</button>
                    </div>
                </div>
                <a href="/College-Basketball-Stats/schedule">Schedule</a>
                <a href="/College-Basketball-Stats/scoreboard">Scoreboard</a>
                <a href="/College-Basketball-Stats/roster">Roster</a>
                <a href="/College-Basketball-Stats/standings">Standings</a>
                <a href="/College-Basketball-Stats/groups">Groups</a>
            </nav>
        </div>
        <div id="user-dropdown" class="user-dropdown">
            <div style="position: relative;">
                <img id="user-team-logo" style="width: 3rem; height: 3rem; margin-right: 10px; display: none; background-color: white; border-radius: 50%; padding: 2px; cursor: pointer;" onclick="toggleTeamSelector()">
                <div id="team-selector-backdrop" onclick="toggleTeamSelector()"></div>
                <div id="team-selector" style="display:none; position: absolute; top: 110%; right: 0; background: white; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.25); border-radius: 8px; z-index: 3000; width: 280px; color: black;">
                    <div class="team-selector-header">
                        <span>Select Favorite Team</span>
                        <span class="team-selector-close" onclick="toggleTeamSelector()">&times;</span>
                    </div>
                    <input type="text" id="team-search-input" placeholder="Search Team..." oninput="searchTeams()" onkeyup="searchTeams()" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 8px; font-size: 16px;">
                    <div id="search-results" style="max-height: 250px; overflow-y: auto;"></div>
                </div>
            </div>
            <button id="username-display" class="username-btn" onclick="toggleDropdown('user-menu')">User</button>
            <div id="user-menu" class="dropdown-content">
                <button onclick="window.location.href='/College-Basketball-Stats/settings'">Settings</button>
                <button onclick="toggleDarkMode()" id="dark-mode-toggle">Dark Mode: Off</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
    </header>
    <div id="game-banner" style="display:none;"></div>
    <div id="content">
        {{ content }}
    </div>
    <script>
        // Initialize league selection
        const currentLeague = localStorage.getItem('league') || 'mens';
        
        // Initialize Dark Mode
        const storedDarkMode = localStorage.getItem('darkMode');
        if (storedDarkMode === 'true' || (storedDarkMode === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark-mode');
        }

        document.getElementById('league-display').textContent = currentLeague === 'mens' ? 'NCAA-M' : 'NCAA-W';

        if (localStorage.getItem('isLoggedIn') === 'true') {
            const userDropdown = document.getElementById('user-dropdown');
            userDropdown.style.display = 'flex';
            userDropdown.style.alignItems = 'center';

            const localTeamId = getFavoriteTeamId();
            const logo = document.getElementById('user-team-logo');
            if (logo) {
                logo.src = `https://a.espncdn.com/i/teamlogos/ncaa/500/${encodeURIComponent(localTeamId)}.png`;
                logo.style.display = 'block';
            }
            const localName = localStorage.getItem('displayName') || localStorage.getItem('username');
            if (localName) {
                document.getElementById('username-display').textContent = localName;
            }

            if (typeof auth !== 'undefined' && auth) {
                auth.onAuthStateChanged(user => {
                    if (user && typeof db !== 'undefined' && db) {
                        db.collection('user_settings').doc(user.uid).get().then(doc => {
                            const data = doc.exists ? doc.data() : {};
                            const displayName = data.displayName || localName || 'User';
                            document.getElementById('username-display').textContent = displayName;

                            const teamId = data.favoriteTeamId || localTeamId;
                            if (logo) {
                                logo.src = `https://a.espncdn.com/i/teamlogos/ncaa/500/${encodeURIComponent(teamId)}.png`;
                                logo.style.display = 'block';
                            }
                        }).catch(() => {});
                    }
                });
            }
        }
        
        // Update Dark Mode Button Text
        const dmBtn = document.getElementById('dark-mode-toggle');
        if (dmBtn) {
            dmBtn.textContent = document.body.classList.contains('dark-mode') ? 'Dark Mode: On' : 'Dark Mode: Off';
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            document.getElementById('dark-mode-toggle').textContent = isDark ? 'Dark Mode: On' : 'Dark Mode: Off';
        }

        function toggleDropdown(id) {
            document.getElementById(id).classList.toggle("show");
        }

        function toggleMobileMenu() {
            document.getElementById('nav-links').classList.toggle('show');
        }

        function selectLeague(league) {
            localStorage.setItem('league', league);
            allTeams = [];
            document.getElementById('league-display').textContent = league === 'mens' ? 'NCAA-M' : 'NCAA-W';
            window.location.href = window.location.pathname;
        }

        let allTeams = [];
        let isLoadingTeams = false;

        async function loadAllTeams() {
            if (allTeams.length > 0 || isLoadingTeams) return;
            isLoadingTeams = true;
            const resultsDiv = document.getElementById('search-results');
            if (resultsDiv && resultsDiv.innerHTML === '') {
                resultsDiv.innerHTML = '<div style="padding: 10px; color: #888; text-align: center; font-size: 0.9em;">Loading teams...</div>';
            }
            try {
                allTeams = await fetchAllTeams(getLeague());
            } catch (e) {
                console.error("Error loading teams:", e);
            } finally {
                isLoadingTeams = false;
                if (document.getElementById('team-search-input')?.value.length >= 2) {
                    searchTeams();
                } else if (resultsDiv && allTeams.length > 0 && resultsDiv.innerHTML.includes('Loading')) {
                    resultsDiv.innerHTML = '';
                }
            }
        }

        function toggleTeamSelector() {
            const selector = document.getElementById('team-selector');
            const backdrop = document.getElementById('team-selector-backdrop');
            if (selector.style.display === 'none') {
                selector.style.display = 'block';
                if (backdrop) backdrop.style.display = 'block';
                loadAllTeams();
                document.getElementById('team-search-input').focus();
            } else {
                selector.style.display = 'none';
                if (backdrop) backdrop.style.display = 'none';
            }
        }

        function searchTeams() {
            const query = document.getElementById('team-search-input').value.toLowerCase();
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = '';
            
            if (query.length < 2) return;

            if (isLoadingTeams) {
                resultsDiv.innerHTML = '<div style="padding: 10px; color: #888; text-align: center; font-size: 0.9em;">Loading teams...</div>';
                return;
            }

            const matches = allTeams.filter(t => (t.displayName && t.displayName.toLowerCase().includes(query)) || (t.nickname && t.nickname.toLowerCase().includes(query)) || (t.shortDisplayName && t.shortDisplayName.toLowerCase().includes(query)));
            
            if (matches.length === 0) {
                resultsDiv.innerHTML = '<div style="padding: 8px; color: #888; text-align: center; font-size: 0.85em;">No teams found</div>';
                return;
            }

            matches.slice(0, 10).forEach(team => {
                const div = document.createElement('div');
                div.style.padding = '8px';
                div.style.cursor = 'pointer';
                div.style.borderBottom = '1px solid #eee';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                const logoUrl = team.logos?.[0]?.href || team.logo || '';
                const logoImg = logoUrl ? `<img src="${escapeHtml(logoUrl)}" width="24" height="24" style="margin-right:8px; object-fit: contain;">` : '';
                div.innerHTML = `${logoImg} <span>${escapeHtml(team.displayName)}</span>`;
                div.onclick = () => selectTeam(team.id);
                div.onmouseover = () => div.style.backgroundColor = '#f5f5f5';
                div.onmouseout = () => div.style.backgroundColor = 'white';
                resultsDiv.appendChild(div);
            });
        }

        function selectTeam(teamId) {
            localStorage.setItem('favoriteTeamId', teamId);
            
            if (typeof auth !== 'undefined' && auth && auth.currentUser && typeof db !== 'undefined' && db) {
                db.collection('user_settings').doc(auth.currentUser.uid).set({
                    favoriteTeamId: teamId
                }, { merge: true }).then(() => {
                    window.location.reload();
                }).catch(() => {
                    window.location.reload();
                });
            } else {
                window.location.reload();
            }
        }

        window.onclick = function(event) {
            if (!event.target.closest('#user-dropdown') && !event.target.closest('#league-dropdown')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
            if (!event.target.closest('#user-team-logo') && !event.target.closest('#team-selector')) {
                const selector = document.getElementById('team-selector');
                const backdrop = document.getElementById('team-selector-backdrop');
                if (selector) selector.style.display = 'none';
                if (backdrop) backdrop.style.display = 'none';
            }
            if (!event.target.matches('.mobile-menu-btn') && !event.target.closest('.nav-links')) {
                const nav = document.getElementById('nav-links');
                if (nav && nav.classList.contains('show')) {
                    nav.classList.remove('show');
                }
            }
        }
        function logout() {
            if (typeof auth !== 'undefined' && auth) {
                auth.signOut().finally(() => {
                    localStorage.removeItem('isLoggedIn');
                    localStorage.removeItem('username');
                    localStorage.removeItem('displayName');
                    window.location.href = '/College-Basketball-Stats/login';
                });
            } else {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('username');
                localStorage.removeItem('displayName');
                window.location.href = '/College-Basketball-Stats/login';
            }
        }

        function goToGameBanner(league, gameId) {
            localStorage.setItem('league', league);
            window.location.href = `/College-Basketball-Stats/scoreboard#${gameId}`;
        }

        (function() {
            const FAV_TEAM_ID = localStorage.getItem('favoriteTeamId') || '152';
            if (localStorage.getItem('isLoggedIn') !== 'true') return;

            async function checkUpcomingGames() {
                const today = new Date();
                const leagues = ['mens', 'womens'];
                let upcomingGames = [];

                for (const league of leagues) {
                    const sportPath = league === 'womens' ? 'womens-college-basketball' : 'mens-college-basketball';
                    try {
                        const data = await fetchTeamSchedule(sportPath, FAV_TEAM_ID);
                        if (data.events) {
                            const nextGame = data.events.find(e => {
                                const gameDate = new Date(e.date);
                                return gameDate.toDateString() === today.toDateString() && gameDate > today;
                            });
                            
                            if (nextGame) {
                                let hasPick = false;
                                if (typeof db !== 'undefined' && typeof auth !== 'undefined') {
                                    const user = await new Promise(resolve => {
                                        if (auth.currentUser) resolve(auth.currentUser);
                                        else {
                                            const unsubscribe = auth.onAuthStateChanged(u => {
                                                unsubscribe();
                                                resolve(u);
                                            });
                                        }
                                    });

                                    if (user) {
                                        const collectionName = `${FAV_TEAM_ID}${league === 'mens' ? 'm' : 'w'}`;
                                        const doc = await db.collection(collectionName).doc(String(nextGame.id)).get().catch(() => null);
                                        if (doc && doc.exists && doc.data()[user.uid]) {
                                            hasPick = true;
                                        }
                                    }
                                }
                                
                                if (!hasPick) {
                                    upcomingGames.push({ game: nextGame, league: league, date: new Date(nextGame.date) });
                                }
                            }
                        }
                    } catch (e) { console.error(e); }
                }

                if (upcomingGames.length > 0) {
                    upcomingGames.sort((a, b) => a.date - b.date);
                    const target = upcomingGames[0];
                    const banner = document.getElementById('game-banner');
                    const timeStr = target.date.toLocaleTimeString([], {hour: 'numeric', minute:'2-digit'});
                    const leagueName = target.league === 'womens' ? "Women's" : "Men's";
                    const opponent = target.game.competitions[0].competitors.find(c => String(c.team.id) !== String(FAV_TEAM_ID));
                    const opponentName = escapeHtml(opponent ? (opponent.team.shortDisplayName || opponent.team.displayName) : 'Opponent');
                    banner.innerHTML = '';
                    const bannerDiv = document.createElement('div');
                    bannerDiv.style.cssText = 'background: linear-gradient(135deg, #cc0000, #990000); color: white; text-align: center; padding: 12px 16px; cursor: pointer; font-weight: bold; border-bottom: 2px solid rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; font-size: 0.95rem;';
                    bannerDiv.innerHTML = `<span>🏀 ${leagueName} vs ${opponentName} today at ${timeStr}</span> <span style="background: white; color: #cc0000; padding: 4px 10px; border-radius: 12px; font-size: 0.82rem; font-weight: 800; display: inline-block;">Make Pick &rarr;</span>`;
                    bannerDiv.addEventListener('click', () => {
                        goToGameBanner(target.league, String(target.game.id));
                    });
                    banner.appendChild(bannerDiv);
                    banner.style.display = 'block';
                }
            }
            checkUpcomingGames();
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                {% if jekyll.environment == "development" %}
                console.log('Service Worker skipped in development mode.');
                {% else %}
                navigator.serviceWorker.register('{{ site.baseurl }}/sw.js');
                {% endif %}
            });
        }
        function updateActiveNav() {
            const currentPath = window.location.pathname.toLowerCase();
            document.querySelectorAll('.bottom-nav-item').forEach(item => {
                const href = (item.getAttribute('href') || '').toLowerCase();
                const pathSlug = href.replace('/college-basketball-stats', '').replace('/', '');
                if (pathSlug && currentPath.includes(pathSlug)) {
                    item.classList.add('active');
                } else if (!pathSlug && (currentPath === '/college-basketball-stats/' || currentPath === '/college-basketball-stats')) {
                    item.classList.add('active');
                } else if (href.endsWith('/scoreboard') && (currentPath === '/college-basketball-stats/' || currentPath === '/college-basketball-stats')) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            document.querySelectorAll('.nav-links a').forEach(link => {
                const href = (link.getAttribute('href') || '').toLowerCase();
                const pathSlug = href.replace('/college-basketball-stats', '').replace('/', '');
                if (pathSlug && currentPath.includes(pathSlug)) {
                    link.style.color = '#fff';
                    link.style.fontWeight = 'bold';
                }
            });
        }
        updateActiveNav();
    </script>
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
        <a href="/College-Basketball-Stats/scoreboard" class="bottom-nav-item" id="nav-item-scoreboard">
            <span class="nav-icon">🏀</span>
            <span class="nav-label">Scores</span>
        </a>
        <a href="/College-Basketball-Stats/schedule" class="bottom-nav-item" id="nav-item-schedule">
            <span class="nav-icon">📅</span>
            <span class="nav-label">Schedule</span>
        </a>
        <a href="/College-Basketball-Stats/roster" class="bottom-nav-item" id="nav-item-roster">
            <span class="nav-icon">👥</span>
            <span class="nav-label">Roster</span>
        </a>
        <a href="/College-Basketball-Stats/standings" class="bottom-nav-item" id="nav-item-standings">
            <span class="nav-icon">🏆</span>
            <span class="nav-label">Standings</span>
        </a>
        <a href="/College-Basketball-Stats/groups" class="bottom-nav-item" id="nav-item-groups">
            <span class="nav-icon">⭐</span>
            <span class="nav-label">Groups</span>
        </a>
    </nav>
</body>
</html>
