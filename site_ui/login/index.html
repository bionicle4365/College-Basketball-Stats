---
layout: default
title: Login
permalink: /login/
---
<div class="login-container">
    <h2 id="form-title" class="login-title">Sign In</h2>
    <form onsubmit="handleSubmit(event)">
        <div class="form-group">
            <input type="email" id="email" placeholder="Enter email" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <div class="form-group">
            <input type="password" id="confirm-password" placeholder="Confirm password" style="display: none;">
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-full">Login</button>
        <button type="button" class="google-btn" onclick="googleLogin()">Sign in with Google</button>
        <div id="error" class="error-msg">Incorrect password</div>
        <a id="toggle-text" class="toggle-link" onclick="toggleMode()">Don't have an account? Sign Up</a>
    </form>
</div>

<script>
    // Redirect if already logged in
    auth.onAuthStateChanged(user => {
        if (user) {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('username', user.displayName || user.email.split('@')[0]);
            window.location.href = '/College-Basketball-Stats/scoreboard';
        }
    });

        let isSignUp = false;

        function toggleMode() {
            isSignUp = !isSignUp;
            const title = document.getElementById('form-title');
            const btn = document.getElementById('submit-btn');
            const toggle = document.getElementById('toggle-text');
            const error = document.getElementById('error');
            const confirmPass = document.getElementById('confirm-password');
            
            error.style.display = 'none';
            
            if (isSignUp) {
                title.textContent = 'Sign Up';
                btn.textContent = 'Sign Up';
                toggle.textContent = 'Already have an account? Sign In';
                confirmPass.style.display = 'block';
                confirmPass.required = true;
            } else {
                title.textContent = 'Sign In';
                btn.textContent = 'Login';
                toggle.textContent = "Don't have an account? Sign Up";
                confirmPass.style.display = 'none';
                confirmPass.required = false;
                confirmPass.value = '';
            }
        }

        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('username', result.user.displayName || result.user.email.split('@')[0]);
                    
                    // Ensure user settings exist
                    db.collection('user_settings').doc(result.user.uid).set({
                        favoriteTeamId: '152' // Default
                    }, { merge: true });

                    window.location.href = '/College-Basketball-Stats/scoreboard';
                }).catch((error) => {
                    const errorDiv = document.getElementById('error');
                    errorDiv.textContent = error.message;
                    errorDiv.style.display = 'block';
                });
        }

        function handleSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('error');

            if (isSignUp) {
                const confirmPass = document.getElementById('confirm-password').value;
                if (password !== confirmPass) {
                    error.textContent = 'Passwords do not match';
                    error.style.display = 'block';
                    return;
                }
                
                auth.createUserWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('username', email.split('@')[0]);
                        
                        // Create default settings
                        db.collection('user_settings').doc(userCredential.user.uid).set({
                            favoriteTeamId: '152'
                        });

                        window.location.href = '/College-Basketball-Stats/scoreboard';
                    })
                    .catch((err) => {
                        error.textContent = err.message;
                        error.style.display = 'block';
                    });
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('username', email.split('@')[0]);
                        window.location.href = '/College-Basketball-Stats/scoreboard';
                    })
                    .catch((err) => {
                        error.textContent = 'Incorrect email or password';
                        error.style.display = 'block';
                    });
            }
        }
</script>
