---
layout: default
title: Login
permalink: /login/
---
<div class="login-container">
    <h2 id="form-title" class="login-title">Sign In</h2>
    <form onsubmit="handleSubmit(event)">
        <div class="form-group">
            <input type="email" id="email" placeholder="Enter email" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <div class="form-group">
            <input type="password" id="confirm-password" placeholder="Confirm password" style="display: none;">
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-full">Login</button>
        <button type="button" class="google-btn" onclick="googleLogin()">Sign in with Google</button>
        <div id="error" class="error-msg"></div>
        <a id="toggle-text" class="toggle-link" onclick="toggleMode()">Don't have an account? Sign Up</a>
    </form>
</div>

<script>
    function handleAuthSuccess(user) {
        if (!user) return;
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('username', user.displayName || user.email.split('@')[0]);
        if (typeof db !== 'undefined' && db) {
            db.collection('user_settings').doc(user.uid).set({
                favoriteTeamId: '152' // Default
            }, { merge: true }).finally(() => {
                window.location.href = '/College-Basketball-Stats/scoreboard';
            });
        } else {
            window.location.href = '/College-Basketball-Stats/scoreboard';
        }
    }

    // Redirect if already logged in or returning from redirect
    if (typeof auth !== 'undefined' && auth) {
        auth.getRedirectResult().then(result => {
            if (result && result.user) {
                handleAuthSuccess(result.user);
            }
        }).catch(err => {
            console.warn('Redirect sign-in error:', err);
        });

        auth.onAuthStateChanged(user => {
            if (user) {
                handleAuthSuccess(user);
            }
        });
    }

        let isSignUp = false;

        function toggleMode() {
            isSignUp = !isSignUp;
            const title = document.getElementById('form-title');
            const btn = document.getElementById('submit-btn');
            const toggle = document.getElementById('toggle-text');
            const error = document.getElementById('error');
            const confirmPass = document.getElementById('confirm-password');
            
            error.style.display = 'none';
            
            if (isSignUp) {
                title.textContent = 'Sign Up';
                btn.textContent = 'Sign Up';
                toggle.textContent = 'Already have an account? Sign In';
                confirmPass.style.display = 'block';
                confirmPass.required = true;
            } else {
                title.textContent = 'Sign In';
                btn.textContent = 'Login';
                toggle.textContent = "Don't have an account? Sign Up";
                confirmPass.style.display = 'none';
                confirmPass.required = false;
                confirmPass.value = '';
            }
        }

        function googleLogin() {
            if (typeof auth === 'undefined' || !auth) {
                const errorDiv = document.getElementById('error');
                errorDiv.textContent = 'Firebase authentication is initializing or unavailable. Please refresh or try again.';
                errorDiv.style.display = 'block';
                return;
            }
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    handleAuthSuccess(result.user);
                }).catch((error) => {
                    // Fallback to redirect if popup is blocked by COOP or browser security
                    if (error.code === 'auth/popup-blocked' || error.code === 'auth/cancelled-popup-request') {
                        console.warn('Popup blocked, falling back to signInWithRedirect:', error);
                        auth.signInWithRedirect(provider);
                        return;
                    }
                    const errorDiv = document.getElementById('error');
                    errorDiv.textContent = error.message;
                    errorDiv.style.display = 'block';
                });
        }

        function handleSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('error');

            if (typeof auth === 'undefined' || !auth) {
                error.textContent = 'Firebase authentication is initializing or unavailable. Please refresh or try again.';
                error.style.display = 'block';
                return;
            }

            if (isSignUp) {
                const confirmPass = document.getElementById('confirm-password').value;
                if (password !== confirmPass) {
                    error.textContent = 'Passwords do not match';
                    error.style.display = 'block';
                    return;
                }
                
                auth.createUserWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        handleAuthSuccess(userCredential.user);
                    })
                    .catch((err) => {
                        error.textContent = err.message;
                        error.style.display = 'block';
                    });
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        handleAuthSuccess(userCredential.user);
                    })
                    .catch((err) => {
                        error.textContent = 'Incorrect email or password';
                        error.style.display = 'block';
                    });
            }
        }
</script>
